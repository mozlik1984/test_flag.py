name: Run Metal Test

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Месяц (капсом: JUN, MAY, MAR) или оставь AUTO'
        required: true
        default: 'AUTO'
      year:
        description: 'Год релиза (например, 2026, 2025) или оставь AUTO'
        required: true
        default: 'AUTO'
        
  schedule:
    - cron: '0 12 * * 1'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Test Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          IN_MONTH="${{ github.event.inputs.month }}"
          IN_YEAR="${{ github.event.inputs.year }}"
          python test_flag.py "${IN_MONTH:-AUTO}" "${IN_YEAR:-AUTO}"
          
