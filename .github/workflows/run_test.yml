name: Run Metal Test

on:
  workflow_dispatch: # Позволяет запускать кнопкой вручную

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Test Script
        run: python test_flag.py
