name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 8.5: Ищем точные текстовые маркеры музыкальной сетки внутри HTML страницы
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from curl_cffi import requests as cloud_requests

          URL_TAG = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 8.5 ---")
          try:
              res = cloud_requests.get(URL_TAG, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа Bandcamp: {res.status_code}")
              print(f"2. Количество символов на странице: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html = res.text
                  
                  # Проверяем маркер 1: data-initial-items
                  if "data-initial-items" in html:
                      print("3. НАЙДЕН МАРКЕР: data-initial-items присутствует в HTML!")
                      idx = html.find("data-initial-items")
                      print(f"   -> Срез кода вокруг маркера: {html[idx:idx+150]}")
                  
                  # Проверяем маркер 2: data-items
                  if "data-items" in html:
                      print("4. НАЙДЕН МАРКЕР: data-items присутствует в HTML!")
                      idx = html.find("data-items")
                      print(f"   -> Срез кода вокруг маркера: {html[idx:idx+150]}")
                      
                  # Проверяем маркер 3: id="music-grid" или классы сеток
                  if "music-grid" in html or "dig-deeper" in html:
                      print("5. НАЙДЕНЫ СИСТЕМНЫЕ КЛАССЫ СЕТОК (music-grid/dig-deeper)!")
                      
                  # Проверим сколько раз вообще в коде страницы встречается слово "album/" в ссылках
                  album_matches = len(re.findall(r'href="[^"]*/album/[^"]*"', html))
                  print(f"6. Всего прямых ссылок на альбомы в коде страницы: {album_matches}")
                  
                  if album_matches > 0:
                      print("\n7. Примеры первых 3 найденных ссылок на альбомы:")
                      links = re.findall(r'href="([^"]*/album/[^"]*)"', html)
                      for l in links[:3]:
                          print(f"   -> Ссылка: {l}")
              else:
                  print("3. СБОЙ: Страница пуста.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 8.5: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем поиск маркеров сетки
      - name: Run Token API Test
        run: python test_metal.py
        
