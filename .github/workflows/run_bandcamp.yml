name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi typing_extensions

      # ШАГ 6.7: Сканируем любые вариации тегов title, игнорируя XML префиксы
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6.7 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа Bandcamp: {res.status_code}")
              print(f"2. Количество символов в ленте: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Ищем любые теги, содержащие слово title (например, <atom:title> или <title>)
                  raw_titles = re.findall(r"<[^>]*title[^>]*>(.*?)</[^>]*title>", res.text)
                  print(f"3. Всего заголовков обнаружено в тексте: {len(raw_titles)}")
                  
                  print("\n4. СЫРОЙ СПИСОК ПЕРВЫХ 10 СТРОК ИЗ ЛЕНТЫ:")
                  count = 0
                  for t in raw_titles:
                      title_clean = t.strip()
                      if "bandcamp" in title_clean.lower() or "new releases" in title_clean.lower():
                          continue
                          
                      print(f"   -> Найдено: {title_clean}")
                      
                      count += 1
                      if count >= 10:
                          break
              else:
                  print("СБОЙ: Ответ пуст.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем гибкий сканер
      - name: Run RSS Content Test
        run: python test_metal.py
        
