name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi html5lib

      # ШАГ 7: Раскодируем data-blob в чистый Python-словарь
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          import html
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 7 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  marker = 'data-blob="'
                  
                  if marker in html_content:
                      start_idx = html_content.find(marker) + len(marker)
                      end_idx = html_content.find('"', start_idx)
                      
                      # Вырезаем сырую зашифрованную строку
                      raw_blob = html_content[start_idx:end_idx]
                      
                      # Шаг 1: Очищаем HTML-сущности (&quot; превращаются в нормальные кавычки)
                      clean_blob = html.unescape(raw_blob)
                      
                      # Шаг 2: Превращаем строку в официальный JSON-словарь Python
                      data = json.loads(clean_blob)
                      print("1. УСПЕХ: data-blob успешно десериализован в JSON!")
                      
                      # Выводим на экран ключи первого уровня, чтобы найти массив с музыкой
                      print(f"2. Главные ключи внутри data-blob: {list(data.keys())}")
                      
                      # Проверяем самый сочный блок контента — appData
                      app_data = data.get("appData", {})
                      if app_data and isinstance(app_data, dict):
                          print(f"3. Найдена секция appData! Ее подразделы: {list(app_data.keys())}")
                          
                          # Ищем блоки с упоминаниемEditorial, Hub, Tags или Items
                          for sub_key in ["hub", "tag", "results", "featuredEditorial"]:
                              if sub_key in app_data:
                                  print(f"   -> Подблок '{sub_key}' обнаружен!")
                      else:
                          print("3. Блок appData пуст или имеет неверный формат.")
                  else:
                      print("СБОЙ: Маркер data-blob пропал со страницы.")
              else:
                  print("СБОЙ: Страница пуста.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 7: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем десериализацию JSON
      - name: Run JSON Decode Test
        run: python test_metal.py
        
