name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      # ШАГ 6.4: Текстовый сканер регулярных выражений без ломающихся HTML-парсеров
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6.4 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа Bandcamp: {res.status_code}")
              print(f"2. Количество символов в ленте: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Ищем всё, что находится строго между <title> и </title>
                  raw_titles = re.findall(r"<title>(.*?)</title>", res.text)
                  print(f"3. Всего текстовых заголовков извлечено: {len(raw_titles)}")
                  
                  print("\n4. ПЕРВЫЕ НАСТОЯЩИЕ СТРОКИ РЕЛИЗОВ С САЙТА:")
                  count = 0
                  for t in raw_titles:
                      title_clean = t.strip()
                      # Пропускаем первые два глобальных заголовка самого сайта Bandcamp
                      if "bandcamp" in title_clean.lower() or "new releases" in title_clean.lower():
                          continue
                          
                      print(f"   -> Найдена группа и альбом: {title_clean}")
                      count += 1
                      if count >= 7:
                          break
              else:
                  print("3. СБОЙ: Ответ пуст.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем прямой текстовый сканер
      - name: Run RSS Content Test
        run: python test_metal.py
        
