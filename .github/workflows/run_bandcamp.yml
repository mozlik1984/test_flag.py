name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      # ЖЕСТКАЯ ПРОВЕРКА СВЯЗИ: Прямой выстрел в Telegram API без посредников
      - name: Total Telegram Test
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: "5002053185"
        run: |
          # Собираем простую текстовую строку строго по твоему формату!
          TEXT_LINE="<code>Darkthrone - Transilvanian Hunger (2026)</code>%0A[Norway] Black Metal%0Ahttps://youtube.com AUG%0A---"
          
          # Стреляем напрямую в серверы Дурова
          curl -s -X POST "https://telegram.org" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$TEXT_LINE" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
            
