name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ШАГ 11.12: Изучаем теги сообщений Телеграма вокруг дефиса
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests

          URL_TG_FEED = "https://t.me"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.12 ---")
          try:
              res = requests.get(URL_TG_FEED, headers=HEADERS, timeout=20)
              print(f"1. Код ответа серверов Telegram: {res.status_code}")
              print(f"2. Количество символов в коде: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html = res.text
                  
                  # Ищем первый попавшийся дефис с пробелами, который разделяет исполнителя и альбом
                  marker = " - "
                  if marker in html:
                      print("3. УСПЕХ: Музыкальный маркер ' - ' успешно обнаружен в коде страницы!")
                      idx = html.find(marker)
                      
                      # Вырезаем кусок кода вокруг дефиса
                      raw_chunk = html[idx-150:idx+200]
                      # Заменяем скобки, чтобы GitHub логов не скрыл их
                      clean_chunk = raw_chunk.replace("<", "&lt;").replace(">", "&gt;")
                      
                      print("\n4. СЫРОЙ КУСОК КОДА ДЛЯ АНАЛИЗА ТЕГОВ ТЕЛЕГРАМА:")
                      print(clean_chunk)
                  else:
                      print("3. СБОЙ: Маркер ' - ' не найден в коде страницы. Лента пуста.")
              else:
                  print("СБОЙ: Не удалось загрузить страницу.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем чтение кода вокруг дефиса
      - name: Run RSS Connection Test
        run: python test_metal.py
        
