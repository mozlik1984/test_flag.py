name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      # ШАГ 11.20: Вытаскиваем текстовые музыкальные заголовки напрямую из рабочего HTML
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from curl_cffi import requests as cloud_requests

          # Наш единственный рабочий адрес, который отдает 110 тысяч символов контента
          URL_DAILY = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.20 ---")
          try:
              res = cloud_requests.get(URL_DAILY, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа сервера: {res.status_code}")
              print(f"2. Количество символов в коде: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Ищем регуляркой структуру "title":"Любой Текст" внутри JavaScript-блоков страницы
                  raw_titles = re.findall(r'"title"\s*:\s*"([^"]*)"', res.text)
                  print(f"3. Всего скрытых текстовых заголовков обнаружено: {len(raw_titles)}")
                  
                  print("\n4. ПЕРВЫЕ 10 НАЙДЕННЫХ СТРОК С САЙТА:")
                  count = 0
                  for t in raw_titles:
                      title_clean = t.strip()
                      # Пропускаем служебный мусор
                      if "bandcamp" in title_clean.lower() or len(title_clean) < 4:
                          continue
                          
                      print(f"   -> Строка из базы сайта: {title_clean}")
                      count += 1
                      if count >= 10:
                          break
                          
                  if count == 0:
                      print("В верстке страницы маркеры '\"title\":\"' не найдены.")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем текстовый сканер скрытых заголовков
      - name: Run RSS Connection Test
        run: python test_metal.py
        
