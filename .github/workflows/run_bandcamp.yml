name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 9: Сканируем data-blob страницы Daily на наличие скрытых музыкальных ссылок
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          import html
          from curl_cffi import requests as cloud_requests

          # Тот самый рабочий адрес, который отдал нам вчерашний сборник Essential Releases
          URL_DAILY = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 9 ---")
          try:
              res = cloud_requests.get(URL_DAILY, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа сервера: {res.status_code}")
              print(f"2. Количество символов на Daily-странице: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  marker = 'data-blob="'
                  
                  if marker in html_content:
                      start_idx = html_content.find(marker) + len(marker)
                      end_idx = html_content.find('"', start_idx)
                      
                      raw_blob = html_content[start_idx:end_idx]
                      # Очищаем зашифрованные HTML-кавычки
                      clean_blob = html.unescape(raw_blob)
                      print("3. УСПЕХ: data-blob Daily-страницы успешно извлечен и очищен!")
                      
                      # Считаем, сколько раз слово "album" или ссылки встречаются внутри этого блока данных
                      album_count = clean_blob.count("album")
                      url_count = clean_blob.count("url")
                      print(f"4. Вхождений маркера 'album' внутри блока: {album_count}")
                      print(f"5. Вхождений маркера 'url' внутри блока: {url_count}")
                      
                      # Выведем небольшой кусочек текста вокруг слова "album", чтобы увидеть структуру
                      if album_count > 0:
                          idx = clean_blob.find("album")
                          print(f"\n6. Срез структуры вокруг найденной музыки:\n{clean_blob[idx-50:idx+250]}")
                  else:
                      print("3. СБОЙ: Маркер data-blob не найден в HTML коде Daily.")
              else:
                  print("3. СБОЙ: Сервер вернул пустой ответ.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 9: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем поиск скрытой музыки в Daily
      - name: Run Token API Test
        run: python test_metal.py
        
