name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi typing_extensions

      # ШАГ 6.8: Выводим первые 15 текстовых строк фида для анализа тегов
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6.8 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Разрезаем весь полученный XML по переносу строки
                  lines = res.text.split("\n")
                  print(f" Всего строк в файле: {len(lines)}")
                  
                  print("\n ПЕРВЫЕ 15 СТРОК ДЛЯ ИЗУЧЕНИЯ СТРУКТУРЫ:")
                  for idx, line in enumerate(lines[:15]):
                      # Заменяем угловые скобки, чтобы GitHub не скрыл их как HTML-теги
                      clean_line = line.replace("<", "&lt;").replace(">", "&gt;")
                      print(f"Строка {idx+1}: {clean_line}")
              else:
                  print("СБОЙ: Ответ пуст.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем вывод структуры
      - name: Run RSS Content Test
        run: python test_metal.py
        
