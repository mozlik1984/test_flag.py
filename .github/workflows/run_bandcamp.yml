name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi typing_extensions

      # ШАГ 6.9: Сканируем живой HTML на наличие скрытого музыкального блока данных
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6.9 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html = res.text
                  
                  # Ищем ключевую сигнатуру современной верстки Bandcamp
                  marker = 'data-initial-items="'
                  if marker in html:
                      print("1. УСПЕХ: Блок data-initial-items успешно найден!")
                      start_idx = html.find(marker) + len(marker)
                      # Печатаем срез данных, чтобы увидеть, группы ли там лежат
                      print(f"2. Срез сырых данных: {html[start_idx:start_idx+400]}")
                  else:
                      print("1. Метрика data-initial-items не найдена.")
                      
                      # Проверим альтернативный современный маркер релизов
                      alt_marker = 'data-blob="'
                      if alt_marker in html:
                          print("1.1. Найдена альтернативная метка data-blob!")
                          start_idx = html.find(alt_marker) + len(alt_marker)
                          print(f"2.1. Срез alt-данных: {html[start_idx:start_idx+400]}")
                      else:
                          print("1.1. Альтернативные метки тоже отсутствуют.")
                          
                          # Ищем вообще любое упоминание названий групп (проверим слово "by ")
                          by_count = html.count(" by ")
                          print(f"2.2. Всего вхождений маркера ' by ' в коде страницы: {by_count}")
              else:
                  print("СБОЙ: Страница пуста.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем поиск маркера
      - name: Run RSS Content Test
        run: python test_metal.py
        
