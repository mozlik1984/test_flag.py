name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 6.2: Переключаемся на стандартный встроенный html.parser
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6.2 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа Bandcamp: {res.status_code}")
              print(f"2. Количество символов в ленте: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # ИСПРАВЛЕНО: Используем стандартный html.parser, он есть всегда
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # Находим все теги <title> внутри скачанной ленты
                  titles = soup.find_all("title")
                  print(f"3. Всего тегов title обнаружено: {len(titles)}")
                  
                  print("\n4. СЫРЫЕ СТРОКИ ИЗ ЛЕНТЫ:")
                  # Выводим первые несколько штук, чтобы увидеть живой текст
                  for t in titles[:7]:
                      print(f"   -> Текст тега: {t.text.strip()}")
              else:
                  print("3. СБОЙ: Лента пуста.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем исправленный текстовый тест
      - name: Run RSS Content Test
        run: python test_metal.py
        
