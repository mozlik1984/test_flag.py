name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 4: Вытаскиваем токены из cfg и штурмуем внутреннее API блэк-метала
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          # Переходим строго к тегу блэк-металла!
          URL_PAGE = "https://bandcamp.com"
          URL_API = "https://bandcamp.com"
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Content-Type": "application/json"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 4 ---")
          try:
              # 1. Скачиваем страницу тега для извлечения конфигурации
              res_page = cloud_requests.get(URL_PAGE, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res_page.status_code == 200:
                  soup = BeautifulSoup(res_page.text, "html.parser")
                  pagedata_tag = soup.find("div", id="pagedata") or soup.find("script", {"id": "pagedata"})
                  
                  if pagedata_tag:
                      raw_blob = pagedata_tag.get("data-blob") or pagedata_tag.text
                      pagedata = json.loads(raw_blob)
                      
                      # Вытаскиваем системные конфигурационные ключи сайта
                      cfg = pagedata.get("cfg", {})
                      print("1. Системный блок конфигурации 'cfg' успешно извлечен!")
                      
                      # Формируем легальный POST-запрос к API, подмешивая извлеченные ключи сайта
                      payload = {
                          "tag": "black-metal",
                          "sort_key": "date",
                          "page": 0
                      }
                      
                      # Добавляем куки сессии, которые выдал Bandcamp при первом заходе
                      session_cookies = res_page.cookies.get_dict()
                      
                      # 2. Штурмуем закрытое API данных блэк-металла
                      res_api = cloud_requests.post(URL_API, json=payload, headers=HEADERS, cookies=session_cookies, impersonate="chrome110", timeout=20)
                      print(f"2. Код ответа внутреннего API Bandcamp: {res_api.status_code}")
                      
                      if res_api.status_code == 200:
                          api_data = res_api.json()
                          # Проверяем все возможные списки релизов в ответе
                          items = api_data.get("items", []) or api_data.get("results", []) or api_data.get("hub_data", {}).get("tabs", {}).get("dig_deeper", {}).get("initial_results", [])
                          
                          print(f"3. УСПЕХ: Внутреннее API отдало релизов: {len(items)}")
                          print("\n4. Первые 5 живых блэк-метал новинок:")
                          for item in items[:5]:
                              print(f"   -> Группа: {item.get('artist')} | Альбом: {item.get('title')} | Локация: {item.get('artist_location')}")
                      else:
                          print(f"3. СБОЙ API: Сервер вернул текст: {res_api.text[:200]}")
                  else:
                      print("СБОЙ: Не найден тег pagedata на странице.")
              else:
                  print(f"СБОЙ: Страница тега вернула код {res_page.status_code}")
                  
          except Exception as e:
              print(f"ОШИБКА НА ШАГЕ 4: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем тест API на экране Гитхаба
      - name: Run Token API Test
        run: python test_metal.py
        
