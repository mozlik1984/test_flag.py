name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 6.1: Читаем ленту через BeautifulSoup, чтобы избежать синтаксических ошибок парсера
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6.1 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа Bandcamp: {res.status_code}")
              print(f"2. Количество символов в ленте: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Используем lxml/html парсер BeautifulSoup, он проглотит любые нестыковки тегов
                  soup = BeautifulSoup(res.text, "xml")
                  
                  # В RSS/Atom лентах Bandcamp названия всегда лежат внутри тегов <title>
                  entries = soup.find_all("entry")
                  print(f"3. Всего музыкальных карточек в ленте: {len(entries)}")
                  
                  print("\n4. СЫРОЙ ТЕКСТ ПЕРВЫХ 5 КАРТОЧЕК ИЗ ЛЕНТЫ:")
                  for entry in entries[:5]:
                      title_tag = entry.find("title")
                      if title_tag:
                          print(f"   -> Найдена строка: {title_tag.text.strip()}")
                      else:
                          print("   -> Карточка найдена, но тег title внутри пуст")
              else:
                  print("3. СБОЙ: Сервер прислал пустой ответ.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем чистый текстовый тест
      - name: Run RSS Content Test
        run: python test_metal.py
        
