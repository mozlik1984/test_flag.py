name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ИСПРАВЛЕНО: Добавлена библиотека typing_extensions для устранения ошибки ImportError
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi typing_extensions

      # ШАГ 6.5: Сборка твоего идеального формата напрямую через регулярные выражения
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from datetime import datetime
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6.5 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Вытаскиваем все текстовые строки между тегами title
                  raw_titles = re.findall(r"<title>(.*?)</title>", res.text)
                  
                  print("🔥 СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  
                  count = 0
                  for t in raw_titles:
                      title_clean = t.strip()
                      
                      # Пропускаем служебные заголовки сайта
                      if "bandcamp" in title_clean.lower() or "new releases" in title_clean.lower():
                          continue
                          
                      # Очистка поджанров (отсекаем дэт/трэш)
                      if any(forbidden in title_clean.lower() for forbidden in FORBIDDEN_KEYWORDS):
                          continue

                      # Разбираем стандартную строку RSS вида "Album Name by Band Name"
                      if " by " in title_clean:
                          title, artist = title_clean.rsplit(" by ", 1)
                      else:
                          title, artist = title_clean, "Underground Artist"

                      # Выводим в лог строго один в один по твоему текстовому шаблону!
                      print(f"<code>{artist.strip()} - {title.strip()} ({current_year})</code>")
                      print("[Norway] Black Metal")
                      print(f"https://youtube.com {month_tag}")
                      print("---")
                      
                      count += 1
                      if count >= 10:
                          break
                          
                  if count == 0:
                      print("Релизы отфильтрованы или не найдены в текущем фиде.")
              else:
                  print("СБОЙ: Ответ сервера пуст.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем финальный текстовый рендеринг
      - name: Run RSS Content Test
        run: python test_metal.py
        
