name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 3: Собираем музыку напрямую из HTML-верстки, игнорируя пустой JSON
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          URL = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 3 ---")
          try:
              res = cloud_requests.get(URL, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # Ищем карточки альбомов по стандартным классам Bandcamp (сетка сетки)
                  items = soup.find_all("li", class_="item") or soup.find_all("div", class_="item") or soup.find_all(class_="hub-item")
                  
                  # Если специализированные классы не найдены, соберем все ссылки на альбомы
                  if not items:
                      print("Специфичные классы не найдены, переключаюсь на сбор по тегам ссылок...")
                      all_links = soup.find_all("a", href=True)
                      album_links = [l for l in all_links if "/album/" in l["href"]]
                      print(f"1. Всего ссылок на альбомы в верстке: {len(album_links)}")
                      
                      print("\n2. Первые 5 найденных релизов:")
                      seen = set()
                      count = 0
                      for link in album_links:
                          text = link.text.strip()
                          href = link["href"]
                          if text and len(text) > 3 and text not in seen and "buy" not in text.lower():
                              print(f"   -> Релиз: {text} | Ссылка: {href}")
                              seen.add(text)
                              count += 1
                              if count >= 5:
                                  break
                  else:
                      print(f"1. Найдено стандартных блоков карточек: {len(items)}")
                      print("\n2. Первые 5 релизов из карточек:")
                      for item in items[:5]:
                          title_tag = item.find(class_="title") or item.find("a")
                          artist_tag = item.find(class_="artist")
                          
                          title = title_tag.text.strip() if title_tag else "Unknown Album"
                          artist = artist_tag.text.strip() if artist_tag else "Unknown Artist"
                          print(f"   -> {artist} - {title}")
                          
          except Exception as e:
              print(f"ОШИБКА ПАРСИНГА ВЕРСТКИ: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем HTML-тест на экране Гитхаба
      - name: Run HTML Layout Test
        run: python test_metal.py
        
