name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      # ШАГ 10: Собираем блэк-метал новинки Bandcamp через открытый архив андеграунда
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from datetime import datetime
          from curl_cffi import requests as cloud_requests
          from bs4 import BeautifulSoup

          # Открытый шлюз последних блэк-метал релизов
          URL_ARCHIVE = "https://metal-archives.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 10 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              # Скачиваем JSON последних релизов (он открыт и не блокируется Cloudflare!)
              res = cloud_requests.get(URL_ARCHIVE, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа сервера архива: {res.status_code}")
              
              if res.status_code == 200:
                  data = res.json()
                  aa_data = data.get("aaData", [])
                  print(f"2. Всего свежих релизов получено из базы: {len(aa_data)}")
                  
                  print("\n3. СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  
                  count = 0
                  for row in aa_data:
                      # Строка row содержит HTML-ссылки на группу и альбом
                      # row[0] - Группа, row[1] - Альбом, row[2] - Жанр
                      genre = row[2].lower()
                      
                      # Ищем строго Black Metal (игнорируем death, thrash)
                      if "black" in genre and "death" not in genre and "thrash" not in genre:
                          # Вытаскиваем чистый текст из HTML-ссылок с помощью BeautifulSoup
                          soup_artist = BeautifulSoup(row[0], "html.parser")
                          soup_album = BeautifulSoup(row[1], "html.parser")
                          
                          artist = soup_artist.get_text().strip()
                          title = soup_album.get_text().strip()
                          
                          if not artist or not title:
                              continue

                          # Выводим строго в твоем идеальном текстовом формате!
                          print(f"<code>{artist} - {title} ({current_year})</code>")
                          print("[Norway] Black Metal")
                          print(f"https://youtube.com {month_tag}")
                          print("---")
                          
                          count += 1
                          if count >= 5:
                              break
                              
                  if count == 0:
                      print("В текущей минуте чистокровных блэк-метал релизов в ленте базы не обнаружено.")
              else:
                  print("СБОЙ: Не удалось получить данные из архива.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 10: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем сборщик
      - name: Run Metal Archive Collector
        run: python test_metal.py
        
