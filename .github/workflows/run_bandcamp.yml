name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Ставим только стандартный requests и bs4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ШАГ 11.16: Выводим блэк-метал новинки строго по твоему текстовому формату!
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import urllib.parse
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup

          BASE_URL = "https://google.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.16 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              # Точечный запрос к открытому кэшу
              query = 'site:bandcamp.com "black metal" "album"'
              encoded_query = urllib.parse.quote_plus(query)
              full_url = f"{BASE_URL}?q={encoded_query}&hl=en-US&gl=US&ceid=US:en"
              
              res = requests.get(full_url, headers=HEADERS, timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # ИСПРАВЛЕНО: Используем стандартный html.parser, он не требует доп. библиотек
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # Находим все теги <title> внутри скачанной ленты
                  titles = soup.find_all("title")
                  
                  print("\n🔥 СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  
                  count = 0
                  seen = set()
                  for t in titles:
                      text_clean = t.text.strip()
                      
                      # Пропускаем служебный заголовок поиска Google
                      if "google news" in text_clean.lower() or len(text_clean) < 6:
                          continue
                          
                      # Очищаем строку от поисковых хвостов Яндекса/Google
                      clean_line = text_clean.split(" - ")[0].replace(" | Bandcamp", "").replace(" - Bandcamp", "").strip()
                      
                      if any(forbidden in clean_line.lower() for forbidden in FORBIDDEN_KEYWORDS):
                          continue
                          
                      if clean_line.lower() in seen:
                          continue

                      # Разбираем стандартную строку Bandcamp "Album Name, by Band Name" или "Artist - Album"
                      if ", by " in clean_line:
                          title, artist = clean_line.split(", by ", 1)
                      elif " - " in clean_line:
                          artist, title = clean_line.split(" - ", 1)
                      else:
                          title, artist = clean_line, "Underground Artist"

                      # Выводим строго в твоем идеальном монолитном текстовом формате!
                      print(f"<code>{artist.strip()} - {title.strip()} ({current_year})</code>")
                      print("[Norway] Black Metal")
                      print(f"https://youtube.com {month_tag}")
                      print("---")
                      
                      seen.add(clean_line.lower())
                      count += 1
                      if count >= 10:
                          break
                          
                  if count == 0:
                      print("Все извлеченные строки отсеялись фильтрами.")
              else:
                  print("СБОЙ: Шлюз вернул пустой ответ.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем финальный текстовый рендеринг
      - name: Run RSS Connection Test
        run: python test_metal.py
        
