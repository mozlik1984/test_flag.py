name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 11: Проверяем прямую связь с официальным новостным фидом Bandcamp
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          from curl_cffi import requests as cloud_requests

          # Официальный открытый XML-шлюз новинок блэк-металла
          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11 ---")
          try:
              # Стучимся напрямую в RSS-ленту
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа RSS Bandcamp: {res.status_code}")
              print(f"2. Количество полученных текстовых символов: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 500:
                  print("3. УСПЕХ: Лента новостей Bandcamp успешно скачана без блокировок!")
                  # Покажем первые 150 символов, чтобы убедиться, что там XML/HTML, а не заглушка
                  print(f"4. Начало фида: {res.text[:150].strip()}")
              else:
                  print("3. СБОЙ: Фид прислал пустой ответ.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 11: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем проверку связи
      - name: Run RSS Connection Test
        run: python test_metal.py
        
