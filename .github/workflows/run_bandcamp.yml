name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 8.3: Читаем сырой текст ответа API без падения метода .json()
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          from curl_cffi import requests as cloud_requests

          URL_API = "https://bandcamp.com"
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 8.3 ---")
          try:
              params = {
                  "tag": "black-metal",
                  "sort": "date",
                  "page": 1
              }
              
              res = cloud_requests.get(URL_API, params=params, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа GET-API Bandcamp: {res.status_code}")
              print(f"2. Количество символов в ответе: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 0:
                  # Печатаем самое начало ответа, чтобы увидеть его реальную структуру
                  # Заменяем скобки, чтобы Гитхаб логов не скрыл их как теги
                  clean_sample = res.text[:300].replace("<", "&lt;").replace(">", "&gt;")
                  print(f"3. Сырой срез ответа сервера: {clean_sample}")
              else:
                  print("3. СБОЙ: Сервер вернул абсолютно пустой ответ.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 8.3: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем чтение сырого текста
      - name: Run Token API Test
        run: python test_metal.py
        
