name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # СБОРЩИК САМ АВТОРИЗУЕТСЯ ЧЕРЕЗ КЛИЕНТСКИЙ ШЛЮЗ И ВЫТАЩИТ КУКУ IDENTITY
      - name: Auto-generate login script
        run: |
          cat << 'EOF' > get_identity.py
          import os
          import json
          from curl_cffi import requests as cloud_requests

          # Официальный внутренний URL авторизации мобильных и веб-приложений Bandcamp
          URL_LOGIN = "https://bandcamp.com"
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Content-Type": "application/json"
          }

          # Забираем логин и пароль из безопасных секретов Гитхаба
          USERNAME = os.getenv("BC_USER")
          PASSWORD = os.getenv("BC_PASS")

          print("--- СТАРТ ПЕРЕХВАТА АВТОРИЗАЦИИ ---")
          try:
              if not USERNAME or not PASSWORD:
                  print("СБОЙ: Секреты BC_LOGIN или BC_PASSWORD не прописаны в настройках репозитория.")
              else:
                  # Формируем легальный пакет авторизации, который принимает их API
                  payload = {
                      "username": USERNAME,
                      "password": PASSWORD
                  }
                  
                  # Стучимся в шлюз авторизации с TLS-отпечатком браузера Chrome
                  res = cloud_requests.post(URL_LOGIN, json=payload, headers=HEADERS, impersonate="chrome110", timeout=20)
                  print(f"1. Код ответа сервера на запрос авторизации: {res.status_code}")
                  
                  if res.status_code == 200:
                      print("2. УСПЕХ: Вход выполнен успешно!")
                      
                      # Извлекаем все куки, которые выдал Bandcamp после успешного ввода пароля
                      cookies = res.cookies.get_dict()
                      
                      if "identity" in cookies:
                          token = cookies["identity"]
                          # Выводим на экран замаскированный токен, чтобы телефон не сломал его кавычками
                          print("3. СЕКРЕТНЫЙ КЛЮЧ УСПЕШНО ПЕРЕХВАЧЕН!")
                          print(f"   -> Твой токен 'identity' (первые 15 знаков): {token[:15]}...")
                          print(f"   -> Твой токен 'identity' (последние 15 знаков): ...{token[-15:]}")
                          print("\nСкопируй эти обрезки или просто зафиксируй успех. В следующем шаге мы зашьем этот токен в память!")
                      else:
                          print("3. СБОЙ: Вход прошел, но кука 'identity' отсутствует в ответе сервера.")
                          print(f"   Доступные куки в ответе: {list(cookies.keys())}")
                  else:
                      print(f"2. СБОЙ АВТОРИЗАЦИИ: Проверь логин/пароль. Ответ сервера: {res.text[:200]}")
                      
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем скрипт-перехватчик
      - name: Extract Identity Cookie
        env:
          BC_USER: ${{ secrets.BC_LOGIN }}
          BC_PASS: ${{ secrets.BC_PASSWORD }}
        run: python get_identity.py
        
