name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 9.5: Запрашиваем чистый JSON статьи из официального контент-API Bandcamp
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          from curl_cffi import requests as cloud_requests

          # Официальный эндпоинт контента блогов с ID вчерашней статьи Essential Releases
          URL_API = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 9.5 ---")
          try:
              res = cloud_requests.get(URL_API, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа API контента: {res.status_code}")
              print(f"2. Количество символов JSON: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 100:
                  data = res.json()
                  print(f"3. УСПЕХ: JSON статьи успешно получен!")
                  print(f"4. Главные ключи в ответе API: {list(data.keys())}")
                  
                  # Заглядываем внутрь самых вероятных блоков с музыкальными плеерами
                  article_data = data.get("article", {}) or data.get("data", {})
                  if isinstance(article_data, dict):
                      print(f"5. Ключи подблока контента: {list(article_data.keys())[:6]}")
                      
                      # Проверяем, есть ли списки аудио или плееров (обычно называются 'items', 'tralbums', 'audio_items')
                      for key in ["items", "tralbums", "audio_items", "body", "blocks"]:
                          if key in article_data:
                              val = article_data[key]
                              if isinstance(val, list):
                                  print(f"   -> Найдена музыкальная папка '{key}' длиной {len(val)} элементов!")
                              else:
                                  print(f"   -> Обнаружен блок '{key}' типа {type(val)}")
                  else:
                      print("5. Сырой срез текста ответа:")
                      print(res.text[:300])
              else:
                  print("СБОЙ: Шлюз контента вернул пустой ответ.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 9.5: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем контент-тест API
      - name: Run Article Content Test
        run: python test_metal.py
        
