name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Ставим только стандартный requests, никаких капризных библиотек!
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ШАГ 11.15: Парсим неблокируемый новостной кэш Google News строго по Bandcamp
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import urllib.parse
          import requests
          from bs4 import BeautifulSoup

          # Официальный полностью открытый RSS-шлюз Google News
          BASE_URL = "https://google.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.15 ---")
          try:
              # Формируем точечный поисковый запрос к кэшу роботов
              query = 'site:bandcamp.com "black metal" "album"'
              encoded_query = urllib.parse.quote_plus(query)
              full_url = f"{BASE_URL}?q={encoded_query}&hl=en-US&gl=US&ceid=US:en"
              
              res = requests.get(full_url, headers=HEADERS, timeout=20)
              print(f"1. Код ответа серверов Google API: {res.status_code}")
              print(f"2. Количество полученных XML символов: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 500:
                  print("3. УСПЕХ: Поисковый кэш успешно скачан без блокировок Cloudflare!")
                  soup = BeautifulSoup(res.text, "xml")
                  
                  # В новостных фидах Google все заголовки лежат в тегах <title>
                  titles = soup.find_all("title")
                  print(f"4. Всего музыкальных записей обнаружено в индексе: {len(titles)}")
                  
                  print("\n5. СЫРЫЕ СТРОКИ РЕЛИЗОВ ИЗ КЭША НА ЭКРАНЕ:")
                  count = 0
                  for t in titles:
                      text_clean = t.text.strip()
                      # Пропускаем главный системный заголовок поиска Google
                      if "google news" in text_clean.lower() or len(text_clean) < 6:
                          continue
                          
                      # Чистим заголовок от хвостов поисковой системы
                      clean_title = text_clean.split(" - ")[0].replace(" | Bandcamp", "").replace(" - Bandcamp", "").strip()
                      print(f"   -> Найдено: {clean_title}")
                      
                      count += 1
                      if count >= 8:
                          break
              else:
                  print("3. СБОЙ: Шлюз вернул пустой ответ.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 11.15: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем стабильный requests парсер Google-кэша
      - name: Run RSS Connection Test
        run: python test_metal.py
        
