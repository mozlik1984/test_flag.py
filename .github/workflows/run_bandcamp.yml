name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # ШАГ Б.7: Вытаскиваем заголовки статей из HTML тегов h2 и h3
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests
          from bs4 import BeautifulSoup

          URL_BLOG = "https://nocleansinging.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА Б.7 ---")
          try:
              res = requests.get(URL_BLOG, headers=HEADERS, timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # Находим все заголовки h2 и h3 на скачанной странице блога
                  headers_tags = soup.find_all("h2") or soup.find_all("h3") or soup.find_all("h1")
                  print(f"1. Всего заголовков статей обнаружено на странице: {len(headers_tags)}")
                  
                  print("\n2. НАСТОЯЩИЕ НАЗВАНИЯ ОБЗОРОВ С ГЛАВНОЙ СТРАНИЦЫ МЕТАЛ-ПОРТАЛА:")
                  count = 0
                  for h in headers_tags:
                      text_clean = h.get_text().strip()
                      if not text_clean or len(text_clean) < 5 or "navigation" in text_clean.lower():
                          continue
                          
                      print(f"   -> Найдена статья: {text_clean}")
                      count += 1
                      if count >= 10:
                          break
                          
                  if count == 0:
                      print("Теги заголовков найдены, но их текстовое содержимое пусто.")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ Б.7: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      - name: Run RSS Connection Test
        run: python test_metal.py
        
