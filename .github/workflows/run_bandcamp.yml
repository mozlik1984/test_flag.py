name: Run Bandcamp Underground Collector

on:
  workflow_dispatch: # Запуск кнопкой в любое время

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Bandcamp Parser
        run: python bandcamp.py
