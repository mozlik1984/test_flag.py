name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # ПРОВЕРОЧНЫЙ ШАГ: Чистый вывод названий групп на экран без отправки в ТГ
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup

          d = chr(46)
          c = chr(58)
          s = chr(47)

          URL_AOTY = "https://albumoftheyear.org"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk", "rap", "pop", "indie", "jazz"]

          print("--- СТАРТ ДИАГНОСТИКИ СБОРА МУЗЫКИ ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              res = requests.get(URL_AOTY, headers=HEADERS, timeout=20)
              print(f"1. Код ответа сервера: {res.status_code}")
              print(f"2. Количество полученных HTML символов: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Ищем регуляркой структуру "Artist - Album" внутри тегов названий релизов
                  raw_pairs = re.findall(r'class="albumTitle">([^<]+) - ([^<]+)</div>', res.text) or re.findall(r'class="artist">([^<]+)</div><div class="title">([^<]+)</div>', res.text)
                  print(f"3. Всего музыкальных пар обнаружено регулярным выражением: {len(raw_pairs)}")
                  
                  print("\n4. ЖИВЫЕ ГРУППЫ С САЙТА НА ЭКРАНЕ:")
                  count = 0
                  seen = set()
                  
                  for pair in raw_pairs:
                      artist = pair[0].strip()
                      title = pair[1].strip()
                      
                      full_desc = f"{artist} {title}".lower()
                      if any(forbidden in full_desc for forbidden in FORBIDDEN_KEYWORDS):
                          continue
                          
                      if full_desc in seen or len(artist) > 30 or len(title) > 40 or len(artist) < 2:
                          continue

                      # Выводим строго в твоем идеальном монолитном текстовом формате!
                      print(f"<code>{artist} - {title} ({current_year})</code>")
                      print("[Norway] Black Metal")
                      print(f"https{c}{s}{s}youtube{d}com {month_tag}")
                      print("---")
                      
                      seen.add(full_desc)
                      count += 1
                      if count >= 5:
                          break
                          
                  if count == 0:
                      print("Музыкальные пары найдены, но все элементы отсеялись фильтрами поджанров.")
              else:
                  print("3. СБОЙ: Сервер вернул пустой ответ.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА ПАРСИНГА: {e}")
          print("--- КОНЕЦ ДИАGNOСТИКИ ---")
          EOF

      # Запускаем чистый текстовый тест
      - name: Run Final Parser
        run: python test_metal.py
        
