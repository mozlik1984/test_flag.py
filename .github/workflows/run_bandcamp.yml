name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # Нарезаем монолитный XML по элементам перед сканированием
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          import requests

          URL_BLOG = "https://nocleansinging.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ПОПЫТКИ Б.5 ---")
          try:
              res = requests.get(URL_BLOG, headers=HEADERS, timeout=20)
              print(f"1. Код ответа метал-портала: {res.status_code}")
              print(f"2. Количество полученных символов: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Режем сплошную строку на отдельные части по тегу </item>
                  clean_text = res.text.replace("</item>", "</item>\n")
                  lines = clean_text.split("\n")
                  print(f"3. Текст успешно нарезан на {len(lines)} строк!")
                  
                  print("\n4. НАСТОЯЩИЕ ТЯЖЕЛЫЕ РЕЛИЗЫ, НАЙДЕННЫЕ В СТРОКАХ:")
                  count = 0
                  for line in lines:
                      match = re.search(r'<title[^>]*>(.*?)</title>', line, re.IGNORECASE)
                      if match:
                          title_clean = match.group(1).replace("<![CDATA[", "").replace("]]>", "").strip()
                          if "no clean singing" in title_clean.lower() or len(title_clean) < 5:
                              continue
                              
                          print(f"   -> Найдена метал-статья: {title_clean}")
                          count += 1
                          if count >= 10:
                              break
                              
                  if count == 0:
                      print("В нарезанных строках заголовки не обнаружены.")
              else:
                  print("3. СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ Б.5: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      - name: Run RSS Connection Test
        run: python test_metal.py
        
