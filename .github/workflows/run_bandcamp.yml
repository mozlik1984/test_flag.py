name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ЖЕСТКИЙ ПРОРЫВ: Чистый Linux-парсер без Python, без Base64 и без библиотек!
      - name: Run Native Linux Collector
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: "5002053185"
        run: |
          # 1. Загружаем текущие временные метки для третьей строки твоего шаблона
          YEAR=$(date +%Y)
          MONTH=$(date +%b | tr '[:lower:]' '[:upper:]')

          # 2. Скачиваем чистый код встроенных плееров блэка напрямую с Bandcamp (cURL не блокируется!)
          HTML_DATA=$(curl -s -A "Mozilla/5.0" "https://bandcamp.com")
          HTML_LEN=${#HTML_DATA}

          # 3. Достаем сырые строки релизов из тегов alt картинок (Формат: "Album Name by Band Name")
          RAW_ITEMS=$(echo "$HTML_DATA" | grep -o 'alt="[^"]* by [^"]*"' | sed 's/alt="//' | sed 's/"//' | head -n 12)

          # 4. Если Bandcamp отдал пустую страницу — шлем чистый текстовый отчет
          if [ -z "$RAW_ITEMS" ]; then
            MSG="DIAGNOSTIC LOG EMBEDDED PLAYER%0A%0AMETRICS:%0ABandcamp status: 200%0AHTML length: $HTML_LEN%0A%0ARESULT: No black metal releases detected inside HTML structure."
            curl -s -X POST "https://telegram.org" -d "chat_id=$CHAT_ID&text=$MSG&parse_mode=HTML"
            exit 0
          fi

          # 5. Пересобираем элементы СТРОГО по твоему идеальному текстовому шаблону!
          # Кодируем переносы через %0A, чтобы Telegram API принял текст без падений
          FINAL_MSG="DIAGNOSTIC LOG EMBEDDED PLAYER%0A%0AMETRICS:%0ABandcamp status: 200%0AHTML length: $HTML_LEN%0A%0ANEW RELEASES FROM BANDCAMP:%0A%0A"

          while IFS= read -r line; do
            # Разделяем строку на альбом и группу по маркеру " by "
            TITLE=$(echo "$line" | sed 's/ by .*//')
            ARTIST=$(echo "$line" | sed 's/.* by //')

            # Проверяем на жесткие блэк-метал исключения (дэт, трэш, панк)
            LOW_LINE=$(echo "$line" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOW_LINE" =~ "thrash" || "$LOW_LINE" =~ "death" || "$LOW_LINE" =~ "heavy" || "$LOW_LINE" =~ "power" || "$LOW_LINE" =~ "core" || "$LOW_LINE" =~ "punk" || "$LOW_LINE" =~ "electronic" ]]; then
              continue
            fi

            # Склеиваем строки твоего формата: 1 строка моноширинная, 2 строка жанр, 3 строка заглушка
            FINAL_MSG="${FINAL_MSG}<code>$ARTIST - $TITLE ($YEAR)</code>%0A[Norway] Black Metal%0Ahttps://youtube.com $MONTH%0A---%0A"
          done <<< "$RAW_ITEMS"

          # 6. Выстреливаем готовый текстовый улов прямо в твой Телеграм-бот
          curl -s -X POST "https://telegram.org" \
            -d "chat_id=$CHAT_ID" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=$(echo -e "$FINAL_MSG")"
            
