name: Run Bandcamp Underground Collector

on:
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Collector Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BANDCAMP_COOKIES: ${{ secrets.BANDCAMP_COOKIES }}
        run: python collector.py
        
