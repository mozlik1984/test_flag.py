name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # ШАГ Б.6: Печатаем 10 сырых строк из середины фида для изучения тегов
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests

          URL_BLOG = "https://nocleansinging.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА Б.6 ---")
          try:
              res = requests.get(URL_BLOG, headers=HEADERS, timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  clean_text = res.text.replace("</item>", "</item>\n")
                  lines = clean_text.split("\n")
                  print(f"1. Текст успешно нарезан на {len(lines)} строк!")
                  
                  print("\n2. СЫРОЙ КОД СТРОК ДЛЯ ИЗУЧЕНИЯ ТЕГОВ ПОРТАЛА:")
                  # Берем 10 строк из середины, где лежат реальные музыкальные посты
                  for idx, line in enumerate(lines[4:14]):
                      # Заменяем угловые скобки, чтобы GitHub не скрыл их как HTML-теги
                      clean_line = line.replace("<", "&lt;").replace(">", "&gt;").strip()
                      # Показываем только начало строки, чтобы лог не раздувался
                      print(f"   [Строка {idx+5}]: {clean_line[:180]}")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      - name: Run RSS Connection Test
        run: python test_metal.py
        
