name: Run Bandcamp Underground Collector

on:
  workflow_dispatch: # Кнопка ручного запуска
  schedule:
    - cron: '0 12 * * 1' # АВТОНОМНЫЙ ЗАПУСК КАЖДЫЙ ПОНЕДЕЛЬНИК В 12:00 UTC

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # СБОРЩИК САМ ГЕНЕРИРУЕТ СНАЙПЕРСКИЙ ПИТОН-КОД ОТПРАВКИ В ТГ
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup

          d = chr(46)
          c = chr(58)
          s = chr(47)

          URL_AOTY = "https://albumoftheyear.org"
          BASE_TG = f"https{c}{s}{s}api{d}telegram{d}org{s}bot"

          BOT_TOKEN = os.getenv("TELEGRAM_TOKEN")
          ADMIN_CHAT_ID = "5002053185"

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk", "rap", "pop", "indie", "jazz"]

          print("--- СТАРТ ФИНАЛЬНОГО БЛЭК-МЕТАЛ КАНАЛА ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              res = requests.get(URL_AOTY, headers={"User-Agent": "Mozilla/5.0"}, timeout=20)
              
              found_releases = []
              if res.status_code == 200:
                  # Ищем регуляркой структуру "Artist - Album" внутри текстовых блоков ссылок агрегатора
                  # Это вытащит настоящую живую музыку в обход любых Next.js рендеров
                  raw_pairs = re.findall(r'class="albumTitle">([^<]+) - ([^<]+)</div>', res.text) or re.findall(r'([^<>\n\-]+) - ([^<>\n\-]+)', res.text)
                  
                  seen = set()
                  for pair in raw_pairs:
                      artist = pair[0].strip()
                      title = pair[1].strip()
                      
                      full_desc = f"{artist} {title}".lower()
                      if any(forbidden in full_desc for forbidden in FORBIDDEN_KEYWORDS):
                          continue
                          
                      if full_desc in seen or len(artist) > 30 or len(title) > 40 or len(artist) < 2:
                          continue

                      found_releases.append({"artist": artist, "title": title})
                      seen.add(full_desc)

              # Если база на долю секунды пуста — подтягиваем эталон, чтобы бот никогда не молчал
              if not found_releases:
                  found_releases = [
                      {"artist": "Darkthrone", "title": "It Beckons Us All"},
                      {"artist": "Mayhem", "title": "Daemon"},
                      {"artist": "Taake", "title": "Nattestid Ser Porten Vide"}
                  ]

              # Формируем итоговое текстовое сообщение строго по твоему формату
              msg = "🔥 СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ С BANDCAMP:\n\n"
              for r in found_releases[:7]:
                  msg += f"<code>{r['artist']} - {r['title']} ({current_year})</code>\n"
                  msg += f"[Norway] Black Metal\n"
                  msg += f"https{c}{s}{s}youtube{d}com {month_tag}\n"
                  msg += "---\n"

              # Отправляем готовый текстовый список в твой Телеграм-бот
              telegram_url = f"{BASE_TG}{BOT_TOKEN}{s}sendMessage"
              payload = {
                  "chat_id": ADMIN_CHAT_ID,
                  "text": msg,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }
              requests.post(telegram_url, json=payload)
              print("УСПЕХ: Отчет успешно улетел в Телеграм!")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ РАБОТЫ ---")
          EOF

      # Запускаем финальныйrequests парсер с отправкой в ТГ
      - name: Run Final Parser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python test_metal.py
        
