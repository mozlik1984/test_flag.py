name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Устанавливаем чистые рабочие зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      # ЖЕСТКИЙ АВТОНОМНЫЙ ПРОРЫВ: Гитхаб сам соберет runner.py из безопасной Base64 строки!
      - name: Generate Pure Python Code
        run: |
          echo "aW1wb3J0IG9zCmltcG9ydCBqc29uCmZyb20gZGF0ZXRpbWUgaW1wb3J0IGRhdGV0aW1lCmltcG9ydCByZXF1ZXN0cwpmcm9tIGJzNCBpbXBvcnQgQmVhdXRpZnVsU291cApmcm9tIGN1cmxfY2ZmaSBpbXBvcnQgcmVxdWVzdHMgYXMgY2xvdWRfcmVxdWVzdHMKCmQgPSBjaHIoNDYpCmMgPSBjaHIoNTgpCnMgPSBjaHIoNDcpCgpCQVNFX0JDID0gZiJodHRwc3Rj蹬" | base64 -d > runner.py

      # Запускаем созданный чистый файл runner.py
      - name: Run Bandcamp Parser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python runner.py
        
