name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 7.4: Полное сканирование содержимого appData на массивы альбомов
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          import html
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 7.4 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  marker = 'data-blob="'
                  
                  if marker in html_content:
                      start_idx = html_content.find(marker) + len(marker)
                      end_idx = html_content.find('"', start_idx)
                      
                      raw_blob = html_content[start_idx:end_idx]
                      clean_blob = html.unescape(raw_blob)
                      data = json.loads(clean_blob)
                      
                      # Вскрываем appData на полную глубину
                      app_data = data.get("appData", {})
                      print("1. УСПЕХ: Секция appData полностью извлечена!")
                      print(f"2. Все доступные ключи внутри appData: {list(app_data.keys())}")
                      
                      print("\n3. Анализ типов данных и структуры подблоков:")
                      for key in app_data.keys():
                          val = app_data[key]
                          if isinstance(val, list):
                              print(f"   -> Обнаружен СПИСОК '{key}' длиной {len(val)} элементов!")
                          elif isinstance(val, dict):
                              # Если это словарь, смотрим его внутренние подразделы (например, hub, tag)
                              print(f"   -> Обнаружен СЛОВАРЬ '{key}' с ключами: {list(val.keys())[:5]}")
                              
                              # Заглядываем на один уровень глубже в поисковые блоки
                              for sub_key in val.keys():
                                  if isinstance(val[sub_key], list) and len(val[sub_key]) > 0:
                                      print(f"      * Внутри '{key}' найден вложенный СПИСОК '{sub_key}' ({len(val[sub_key])} элементов)")
                                  elif isinstance(val[sub_key], dict):
                                      print(f"      * Внутри '{key}' найден вложенный СЛОВАРЬ '{sub_key}' с ключами: {list(val[sub_key].keys())[:3]}")
                  else:
                      print("СБОЙ: data-blob не найден.")
          except Exception as e:
              print(f"ОШИБКА НА ШАГЕ 7.4: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем глубокий анализ appData
      - name: Run JSON Decode Test
        run: python test_metal.py
        
