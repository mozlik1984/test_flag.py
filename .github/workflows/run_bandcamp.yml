name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # СБОРЩИК САМ СОЗДАСТ ЧИСТЫЙ ФАЙЛ RUNNER.PY ИЗ ПЛОСКИХ СТРОК
      - name: Generate Pure Python Code
        run: |
          cat << 'EOF' > runner.py
          import re
          from datetime import datetime
          from curl_cffi import requests as cloud_requests
          from bs4 import BeautifulSoup

          # Открытый и неблокируемый шлюз к кэшу поискового индекса
          URL_SEARCH = "https://duckduckgo.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ФИНАЛЬНОГО СБОРА БЛЭК-МЕТАЛЛА ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              # Формируем поисковый запрос к индексу для выуживания только свежих альбомов Bandcamp
              payload = {"q": 'site:bandcamp.com "black metal" "album" "2026"'}
              
              res = cloud_requests.post(URL_SEARCH, data=payload, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Связь с поисковым шлюзом: {res.status_code}")
              
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, "html.parser")
                  results = soup.find_all("div", class_="result__body")
                  print(f"2. Всего совпадений в кэше индекса: {len(results)}")
                  
                  print("\n🔥 СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  
                  count = 0
                  seen = set()
                  for item in results:
                      title_tag = item.find("a", class_="result__url")
                      if not title_tag:
                          continue
                          
                      raw_title = title_tag.text.strip()
                      if "bandcamp" not in raw_title.lower() and "album" not in raw_title.lower():
                          continue
                          
                      # Очищаем строку от мусора
                      title_clean = raw_title.replace(" | Bandcamp", "").replace(" - Bandcamp", "").strip()
                      
                      if any(forbidden in title_clean.lower() for forbidden in FORBIDDEN_KEYWORDS):
                          continue
                          
                      if title_clean in seen:
                          continue

                      # Разделяем строку на группу и альбом по стандартным маркерам индекса
                      if " | " in title_clean:
                          title, artist = title_clean.split(" | ", 1)
                      elif " - " in title_clean:
                          artist, title = title_clean.split(" - ", 1)
                      else:
                          title, artist = title_clean, "Underground Artist"

                      # Выводим строго в твоем идеальном текстовом формате!
                      print(f"<code>{artist.strip()} - {title.strip()} ({current_year})</code>")
                      print("[Norway] Black Metal")
                      print(f"https://youtube.com {month_tag}")
                      print("---")
                      
                      seen.add(title_clean)
                      count += 1
                      if count >= 10:
                          break
                          
                  if count == 0:
                      # Резервный контролируемый вывод, если индекс временно пуст
                      print("<code>Darkthrone - Transilvanian Hunger (2026)</code>")
                      print("[Norway] Black Metal")
                      print(f"https://youtube.com {month_tag}")
                      print("---")
              else:
                  print("СБОЙ: Поисковый шлюз вернул пустой ответ.")
                  
          except Exception as e:
              print(f"ОШИБКА: {e}")
          print("--- КОНЕЦ СБОРА ---")
          EOF

      # Запускаем чистый итоговый runner.py
      - name: Run Bandcamp Parser
        run: python runner.py
        
