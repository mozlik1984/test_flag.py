name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Месяц (капсом: JAN, FEB, MAR) или AUTO'
        required: true
        default: 'AUTO'
      year:
        description: 'Год релиза (например, 2026, 2025) или AUTO'
        required: true
        default: 'AUTO'

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Bandcamp Parser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bandcamp.py "${{ github.event.inputs.month }}" "${{ github.event.inputs.year }}"
