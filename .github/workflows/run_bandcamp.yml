name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 6: Штурмуем вечно открытые текстовые фиды Bandcamp RSS
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from curl_cffi import requests as cloud_requests

          # Берем официальный RSS-шлюз новинок
          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 6 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              # Запрашиваем чистый XML-текст фида
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа RSS Bandcamp: {res.status_code}")
              print(f"2. Количество символов XML: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Парсим XML структуру новостной ленты Atom Feed
                  root = ET.fromstring(res.text)
                  ns = {'atom': 'http://w3.org'}
                  entries = root.findall('atom:entry', ns)
                  
                  print(f"3. УСПЕХ: Найдено релизов в новостной ленте: {len(entries)}")
                  print("\n4. СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  
                  count = 0
                  for entry in entries:
                      title_tag = entry.find('atom:title', ns)
                      if title_tag is None:
                          continue
                          
                      title_text = title_tag.text.strip()
                      
                      # Фильтрация поджанров (отсекаем трэш/дэт)
                      if any(forbidden in title_text.lower() for forbidden in FORBIDDEN_KEYWORDS):
                          continue

                      # Разбираем стандартный формат RSS "Album Name by Band Name"
                      if " by " in title_text:
                          title, artist = title_text.rsplit(" by ", 1)
                      else:
                          title, artist = title_text, "Underground Artist"

                      # Ищем страну в блоке аннотации summary
                      summary_tag = entry.find('atom:summary', ns)
                      summary_text = summary_tag.text.lower() if summary_tag is not None else ""
                      
                      location = "Norway"
                      for country in ["sweden", "finland", "france", "germany", "usa", "ukraine", "poland", "austria"]:
                          if country in summary_text or country in title_text.lower():
                              location = country.title()
                              if location == "Usa": location = "USA"
                              break

                      # Выводим строго в твоем идеальном текстовом формате!
                      print(f"<code>{artist.strip()} - {title.strip()} ({current_year})</code>")
                      print(f"[{location}] Black Metal")
                      print(f"https://youtube.com {month_tag}")
                      print("---")
                      
                      count += 1
                      if count >= 10:
                          break
              else:
                  print("3. СБОЙ: Фид вернул пустой текст или ошибку.")
                  
          except Exception as e:
              print(f"ОШИБКА НА ШАГЕ 6: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем RSS тест
      - name: Run RSS Feed Test
        run: python test_metal.py
        
