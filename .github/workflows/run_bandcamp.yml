name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ШАГ 11.19: Печатаем сырые заголовки без единого фильтра
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import urllib.parse
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup

          BASE_URL = "https://google.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.19 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              query = 'site:bandcamp.com "black metal" "album"'
              encoded_query = urllib.parse.quote_plus(query)
              full_url = f"{BASE_URL}?q={encoded_query}&hl=en-US&gl=US&ceid=US:en"
              
              res = requests.get(full_url, headers=HEADERS, timeout=20)
              
              if res.status_code == 200 and len(res.text) > 100:
                  soup = BeautifulSoup(res.text, "html.parser")
                  titles = soup.find_all("title")
                  
                  print(f"Всего тегов title найдено в XML: {len(titles)}")
                  print("\n4. СЫРОЙ ТЕКСТ ПЕРВЫХ 15 ЗАГОЛОВКОВ:")
                  
                  for idx, t in enumerate(titles[:15]):
                      print(f"   [{idx+1}] -> {t.text.strip()}")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем сырой вывод заголовков
      - name: Run RSS Connection Test
        run: python test_metal.py
        
