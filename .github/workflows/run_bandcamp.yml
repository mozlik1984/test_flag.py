name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 8.1: Штурмуем официальный внутренний API шлюз релизов по тегам
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          from curl_cffi import requests as cloud_requests

          # Официальный рабочий эндпоинт выдачи музыки по тегам
          URL_API = "https://bandcamp.com"
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Content-Type": "application/json"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 8.1 ---")
          try:
              # Передаем легальные параметры, которые просит фронтенд Bandcamp:
              # tag - нужный стиль, sort - сортировка по дате (p = format_id релиза)
              payload = {
                  "tag": "black-metal",
                  "sort": "date",
                  "page": 1
              }
              
              # Стучимся во внутреннее API с имитацией TLS-отпечатка Chrome
              res = cloud_requests.post(URL_API, json=payload, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа тегового API Bandcamp: {res.status_code}")
              
              if res.status_code == 200:
                  data = res.json()
                  
                  # Смотрим, какие ключи вернул нам шлюз в JSON ответе
                  print(f"2. Главные ключи в ответе API: {list(data.keys())}")
                  
                  # Обычно релизы лежат в ключе 'items' или 'results'
                  items = data.get("items", []) or data.get("results", [])
                  print(f"3. УgridЕХ: Найдено сырых музыкальных релизов: {len(items)}")
                  
                  print("\n4. Первые 5 живых блэк-метал новинок из базы:")
                  for item in items[:5]:
                      title = item.get("title") or item.get("name") or "Unknown Album"
                      artist = item.get("artist") or item.get("artist_name") or "Unknown Artist"
                      print(f"   -> Группа: {artist} | Альбом: {title}")
              else:
                  print(f"СБОЙ ШЛЮЗА: Сервер прислал текстовый ответ: {res.text[:300]}")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 8.1: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем POST-запрос к теговому API
      - name: Run Token API Test
        run: python test_metal.py
        
