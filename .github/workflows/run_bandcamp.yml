name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ШАГ 11.14: Читаем сырой текст ошибки 403 для точной настройки сетевого обхода
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests

          URL_RSS_BRIDGE = "https://rsshub.app"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.14 ---")
          try:
              res = requests.get(URL_RSS_BRIDGE, headers=HEADERS, timeout=20)
              print(f"1. Код ответа сервера: {res.status_code}")
              print(f"2. Количество символов в ответе: {len(res.text)}")
              
              if len(res.text) > 0:
                  # Заменяем скобки, чтобы GitHub логов не скрыл их как HTML-теги
                  clean_sample = res.text[:500].replace("<", "&lt;").replace(">", "&gt;")
                  print(f"\n3. СЫРОЙ СРЕЗ ТЕКСТА ОШИБКИ ДЛЯ АНАЛИЗА ЗАЩИТЫ:\n{clean_sample}")
              else:
                  print("3. СБОЙ: Сервер вернул абсолютно пустой ответ.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем чтение сырого текста ошибки
      - name: Run RSS Connection Test
        run: python test_metal.py
        
