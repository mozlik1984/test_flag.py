name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # ШАГ 11.26: Печатаем чистый текст всех найденных ссылок без фильтрации
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests
          from bs4 import BeautifulSoup

          URL_AOTY = "https://albumoftheyear.org"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.26 ---")
          try:
              res = requests.get(URL_AOTY, headers=HEADERS, timeout=20)
              print(f"1. Код ответа сервера: {res.status_code}")
              print(f"2. Количество символов в коде: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # Извлекаем абсолютно все ссылки на странице
                  links = soup.find_all("a")
                  print(f"3. Всего ссылок обнаружено в верстке: {len(links)}")
                  
                  print("\n4. СЫРОЙ ТЕКСТ ПЕРВЫХ 20 ССЫЛОК С САЙТА:")
                  count = 0
                  for l in links:
                      text_clean = l.text.strip().replace("\n", " ")
                      # Пропускаем пустые или слишком короткие менюшки
                      if not text_clean or len(text_clean) < 5 or "javascript" in text_clean.lower():
                          continue
                          
                      print(f"   -> [{count+1}] Ссылка содержит текст: {text_clean}")
                      count += 1
                      if count >= 20:
                          break
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      - name: Run Final Parser
        run: python test_metal.py
        
