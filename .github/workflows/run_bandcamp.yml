name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ШАГ 11.10: Сканируем открытый веб-фид блэк-метал новинок без блокировок Cloudflare
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import os
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup

          # ASCII маскировка путей для Telegram
          d = chr(46)
          c = chr(58)
          s = chr(47)

          # Открытая веб-лента крупнейшего агрегатора релизов Bandcamp
          URL_TG_FEED = "https://t.me"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.10 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              # Скачиваем веб-версию канала (Телеграм ГитхабActions не блокирует)
              res = requests.get(URL_TG_FEED, headers=HEADERS, timeout=20)
              print(f"1. Код ответа серверов Telegram: {res.status_code}")
              print(f"2. Количество полученных текстовых символов: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # В веб-версии ТГ текст постов всегда лежит в блоках с этим классом
                  posts = soup.find_all("div", class_="tgme_page_widget_inline_content") or soup.find_all("div", class_="js-message_text")
                  print(f"3. Всего постов с релизами обнаружено: {len(posts)}")
                  
                  print("\n4. СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  count = 0
                  seen = set()
                  
                  for post in posts:
                      text_clean = post.get_text().strip()
                      if not text_clean or " - " not in text_clean:
                          continue
                          
                      if any(forbidden in text_clean.lower() for forbidden in FORBIDDEN_KEYWORDS):
                          continue
                          
                      if text_clean.lower() in seen:
                          continue

                      # Извлекаем первую строчку поста (обычно там формат "Artist - Title")
                      first_line = text_clean.split("\n")[0].strip()
                      if " - " in first_line:
                          artist, title = first_line.split(" - ", 1)
                          # Очищаем от мусора на концах
                          title = title.split("(")[0].strip()
                          artist = artist.strip()
                      else:
                          continue

                      # Выводим строго в твоем идеальном монолитном текстовом формате!
                      print(f"<code>{artist} - {title} ({current_year})</code>")
                      print("[Norway] Black Metal")
                      print(f"https{c}{s}{s}youtube{d}com {month_tag}")
                      print("---")
                      
                      seen.add(text_clean.lower())
                      count += 1
                      if count >= 5:
                          break
                  if count == 0:
                      print("Все релизы из текущей ленты постов отсеялись фильтрами.")
              else:
                  print("3. СБОЙ: Сервер вернул пустой ответ.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 11.10: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаемrequests парсер ТГ-ленты
      - name: Run RSS Connection Test
        run: python test_metal.py
        
