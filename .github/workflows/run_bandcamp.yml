name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 10: Охота за скрытым CSRF/Сессионным токеном Bandcamp
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from curl_cffi import requests as cloud_requests

          URL_BASE = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 10 ---")
          try:
              res = cloud_requests.get(URL_BASE, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа сервера: {res.status_code}")
              
              if res.status_code == 200:
                  html = res.text
                  
                  # Ищем любые упоминания токенов защиты в коде страницы
                  csrf_matches = re.findall(r'csrfToken\s*:\s*"([^"]*)"', html) or re.findall(r'data-csrf="([^"]*)"', html)
                  token_matches = re.findall(r'token\s*:\s*"([^"]*)"', html)
                  
                  if csrf_matches:
                      print(f"2. УСПЕХ: Найден секретный CSRF токен сайта: {csrf_matches[0]}")
                  else:
                      print("2. Маркер csrfToken в явном виде не обнаружен.")
                      
                  if token_matches:
                      print(f"3. НАЙДЕН альтернативный системный токен: {token_matches[0]}")
                  else:
                      print("3. Альтернативные токены в верхних скриптах отсутствуют.")
                      
                  # Проверяем, выдал ли нам сервер куки сессии (они тоже работают как токен авторизации API)
                  cookies = res.cookies.get_dict()
                  print(f"4. Всего кук выдано сервером: {len(cookies)}")
                  if cookies:
                      print(f"   -> Названия активных сессионных кук: {list(cookies.keys())}")
              else:
                  print("СБОЙ: Сервер ответил отказом.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 10: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем охоту за токенами
      - name: Run Token API Test
        run: python test_metal.py
        
