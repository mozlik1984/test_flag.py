name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 9.4: Заходим внутрь статьи Essential Releases и смотрим структуру музыки
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          import html
          from curl_cffi import requests as cloud_requests

          # Прямой адрес вчерашней статьи-подборки, которую мы выудили из лога
          URL_ARTICLE = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 9.4 ---")
          try:
              # Прошиваем защиту статьи через имитацию браузера
              res = cloud_requests.get(URL_ARTICLE, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа сервера при входе в статью: {res.status_code}")
              print(f"2. Количество символов в коде статьи: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  marker = 'data-blob="'
                  
                  if marker in html_content:
                      print("3. УСПЕХ: Внутренний data-blob статьи успешно обнаружен!")
                      start_idx = html_content.find(marker) + len(marker)
                      end_idx = html_content.find('"', start_idx)
                      
                      raw_blob = html_content[start_idx:end_idx]
                      clean_blob = html.unescape(raw_blob)
                      
                      print("\n4. СЫРОЙ КУСОК ДАННЫХ СТАТЬИ С НАЗВАНИЯМИ АЛЬБОМОВ:")
                      # Выводим верхушку блока данных, где лежат плееры альбомов
                      print(clean_blob[:1000])
                  else:
                      print("3. СБОЙ: Маркер data-blob внутри статьи не найден.")
              else:
                  print("СБОЙ: Не удалось загрузить код статьи.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 9.4: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем парсинг внутренностей вчерашней статьи
      - name: Run Article Content Test
        run: python test_metal.py
        
