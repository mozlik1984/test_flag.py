name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # ПОПЫТКА Б.1: Проверяем связь с открытым экстремальным метал-фидом
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests
          from bs4 import BeautifulSoup

          # Открытый RSS фид крупнейшего портала экстремальной музыки
          URL_BLOG = "https://nocleansinging.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ПОПЫТКИ Б.1 ---")
          try:
              res = requests.get(URL_BLOG, headers=HEADERS, timeout=20)
              print(f"1. Код ответа метал-портала: {res.status_code}")
              print(f"2. Количество полученных символов контента: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  print("3. УСПЕХ: Метал-фид успешно скачан без блокировок!")
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # В стандартных RSS темах заголовки постов лежат в тегах <title>
                  titles = soup.find_all("title")
                  print(f"4. Всего заголовков обзоров найдено в фиде: {len(titles)}")
                  
                  print("\n5. ВЕРХУШКА ЛЕНТЫ ОБЗОРОВ СЕРВЕРА:")
                  count = 0
                  for t in titles:
                      text_clean = t.text.strip()
                      if "no clean singing" in text_clean.lower():
                          continue
                      print(f"   -> Найдена статья: {text_clean}")
                      count += 1
                      if count >= 5:
                          break
              else:
                  print("3. СБОЙ: Сервер вернул пустой ответ или ошибку.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ Б.1: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      - name: Run RSS Connection Test
        run: python test_metal.py
        
