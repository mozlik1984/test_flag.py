name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 11.1: Ищем ссылки на альбомы напрямую внутри скачанного HTML-кода
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.1 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # Находим абсолютно все теги ссылок <a> на странице
                  all_links = soup.find_all("a", href=True)
                  
                  # Фильтруем только те, которые ведут на альбомы (содержат в адресе "/album/")
                  album_links = [l for l in all_links if "/album/" in l["href"].lower()]
                  print(f"1. Всего ссылок на музыкальные альбомы обнаружено: {len(album_links)}")
                  
                  print("\n2. Текстовое содержимое первых 5 найденных ссылок:")
                  count = 0
                  for link in album_links:
                      text_clean = link.text.strip()
                      href_clean = link["href"].strip()
                      # Пропускаем пустые клики
                      if text_clean and len(text_clean) > 2:
                          print(f"   -> Текст ссылки: {text_clean} | URL: {href_clean}")
                          count += 1
                          if count >= 5:
                              break
                              
                  if count == 0:
                      print("   -> Ссылки со словом '/album/' найдены, но их текстовые блоки пусты.")
              else:
                  print("СБОЙ: Не удалось получить контент страницы.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 11.1: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем поиск ссылок
      - name: Run RSS Connection Test
        run: python test_metal.py
        
