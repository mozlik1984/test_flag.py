name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 8: Вскрываем data-blob на НАСТОЯЩЕЙ странице тега
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          import html
          from curl_cffi import requests as cloud_requests

          # Переходим на НАСТОЯЩУЮ страницу тега, где живет андеграунд
          URL_TAG = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 8 ---")
          try:
              res = cloud_requests.get(URL_TAG, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа Bandcamp: {res.status_code}")
              print(f"2. Количество символов на странице: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  marker = 'data-blob="'
                  
                  if marker in html_content:
                      start_idx = html_content.find(marker) + len(marker)
                      end_idx = html_content.find('"', start_idx)
                      
                      raw_blob = html_content[start_idx:end_idx]
                      clean_blob = html.unescape(raw_blob)
                      data = json.loads(clean_blob)
                      print("3. УСПЕХ: data-blob настоящей страницы тега десериализован!")
                      
                      # Смотрим главные ключи настоящей страницы
                      print(f"4. Главные ключи в JSON: {list(data.keys())}")
                      
                      # Проверяем наличие скрытых блоков appData или hub_data
                      app_data = data.get("appData", {})
                      if app_data:
                          print(f"5. Найдена секция appData! Ее ключи: {list(app_data.keys())}")
                      
                      # Проверяем альтернативные блоки, если они есть
                      for alt_key in ["hub_data", "tag_data", "items"]:
                          if alt_key in data:
                              print(f"5.1. Обнаружен альтернативный блок '{alt_key}'!")
                  else:
                      print("3. СБОЙ: Маркер data-blob не найден на странице тега.")
              else:
                  print("3. СБОЙ: Страница вернула пустой ответ.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 8: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем анализ настоящей страницы
      - name: Run JSON Decode Test
        run: python test_metal.py
        
