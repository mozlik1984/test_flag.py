name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 5: Переводим шлюз в GET-режим и выводим блэк-метал строго по твоему шаблону!
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          from datetime import datetime
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          # Актуальный GET-шлюз для сбора глубокого андеграунда по тегам
          URL_API = "https://bandcamp.com"
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 5 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              # ИСПРАВЛЕНО: Передаем параметры через GET-строку, как требует Nginx на Bandcamp
              params = {
                  "tag": "black-metal",
                  "sort_key": "date",
                  "page": 0
              }
              
              res_api = cloud_requests.get(URL_API, params=params, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа GET-API Bandcamp: {res_api.status_code}")
              
              if res_api.status_code == 200:
                  api_data = res_api.json()
                  
                  # Проверяем все возможные списки вложенности релизов
                  items = api_data.get("items", []) or api_data.get("results", []) or api_data.get("initial_results", [])
                  print(f"2. УСПЕХ: Внутренний шлюз выдал сырых релизов: {len(items)}")
                  
                  print("\n3. СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  
                  count = 0
                  for item in items:
                      title = item.get("title") or item.get("name") or "Unknown Album"
                      artist = item.get("artist") or item.get("artist_name") or "Unknown Artist"
                      
                      # Собираем теги для блэк-метал очистки от дета/трэша
                      tags_list = [t.lower() for t in item.get("tags", [])]
                      full_desc = f"{title} {artist} {' '.join(tags_list)}".lower()
                      
                      if any(forbidden in full_desc for forbidden in FORBIDDEN_KEYWORDS):
                          continue

                      # Разбираем локацию группы для текстовой разметки страны
                      location = item.get("artist_location", "").strip() or item.get("location", "Norway").strip()
                      if ", " in location:
                          location = location.split(", ")[-1]
                      if not location or location == "null":
                          location = "Norway"

                      # Выводим в консоль строго один в один по твоему идеальному шаблону!
                      print(f"<code>{artist.strip()} - {title.strip()} ({current_year})</code>")
                      print(f"[{location}] Black Metal")
                      print(f"https://youtube.com {month_tag}")
                      print("---")
                      
                      count += 1
                      if count >= 10:
                          break
              else:
                  print(f"СБОЙ ШЛЮЗА: Текст ошибки: {res_api.text[:200]}")
                  
          except Exception as e:
              print(f"ОШИБКА НА ШАГЕ 5: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем исправленный GET-тест на экране Гитхаба
      - name: Run GET API Test
        run: python test_metal.py
        
