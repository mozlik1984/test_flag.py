name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi typing_extensions

      # ШАГ 7.2: Копаем внутрь featuredEditorial и печатаем сырые названия альбомов
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          import html
          from curl_cffi import requests as cloud_requests

          URL_RSS = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 7.2 ---")
          try:
              res = cloud_requests.get(URL_RSS, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  marker = 'data-blob="'
                  
                  if marker in html_content:
                      start_idx = html_content.find(marker) + len(marker)
                      end_idx = html_content.find('"', start_idx)
                      
                      raw_blob = html_content[start_idx:end_idx]
                      clean_blob = html.unescape(raw_blob)
                      data = json.loads(clean_blob)
                      
                      # Прыгаем сразу к нашему блоку с релизами
                      app_data = data.get("appData", {})
                      editorial = app_data.get("featuredEditorial", {})
                      
                      # featuredEditorial может содержать ключ 'items' или 'bigItem'
                      items = []
                      if isinstance(editorial, dict):
                          # Проверяем все типичные ключи вложенности списков Bandcamp
                          items = editorial.get("items", []) or editorial.get("articles", [])
                          big_item = editorial.get("bigItem")
                          if big_item:
                              items.insert(0, big_item)
                              
                      print(f"1. Из секции featuredEditorial извлечено элементов: {len(items)}")
                      
                      print("\n2. ЖИВЫЕ СТРОКИ ИЗ ОБЗОРОВ BANDCAMP:")
                      count = 0
                      for item in items:
                          # Проверяем разные названия полей (в статьях часто пишутся title, artist, subtitle)
                          title = item.get("title") or item.get("album_title") or "Unknown Title"
                          artist = item.get("artist") or item.get("band_name") or "Unknown Artist"
                          url = item.get("url") or item.get("article_url") or "No URL"
                          
                          print(f"   -> Найдено: {artist} - {title} | Ссылка: {url}")
                          count += 1
                          if count >= 5:
                              break
                              
                      if count == 0:
                          print("Секция пуста, выводим сырой дамп блока для анализа:")
                          print(json.dumps(editorial, indent=2)[:500])
                  else:
                      print("СБОЙ: Маркер data-blob не найден.")
              else:
                  print("СБОЙ: Ответ пуст.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 7.2: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем извлечение названий групп
      - name: Run JSON Decode Test
        run: python test_metal.py
        
