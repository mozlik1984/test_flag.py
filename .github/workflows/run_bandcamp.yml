name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ШАГ 11.18: Переводим разбор на безопасные регулярные выражения re.search
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          import urllib.parse
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup

          BASE_URL = "https://google.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.17 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              query = 'site:bandcamp.com "black metal" "album"'
              encoded_query = urllib.parse.quote_plus(query)
              full_url = f"{BASE_URL}?q={encoded_query}&hl=en-US&gl=US&ceid=US:en"
              
              res = requests.get(full_url, headers=HEADERS, timeout=20)
              
              if res.status_code == 200 and len(res.text) > 100:
                  soup = BeautifulSoup(res.text, "html.parser")
                  titles = soup.find_all("title")
                  
                  print("\n🔥 СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                  
                  count = 0
                  seen = set()
                  for t in titles:
                      text_raw = t.text.strip()
                      
                      if "google news" in text_raw.lower() or len(text_raw) < 10:
                          continue
                          
                      if any(forbidden in text_raw.lower() for forbidden in FORBIDDEN_KEYWORDS):
                          continue
                          
                      if text_raw.lower() in seen:
                          continue

                      # ЖЕСТКОЕ ПРАВИЛО: Вытаскиваем "Исполнитель - Альбом" регуляркой
                      # Ищем структуру, где текст разделен дефисом или вертикальной чертой
                      match = re.search(r'([^|-]+)\s*[|-]\s*([^|-]+)', text_raw)
                      
                      if match:
                          part1 = match.group(1).strip()
                          part2 = match.group(2).strip()
                          
                          # Чистим от системных хвостов Bandcamp
                          if "bandcamp" in part1.lower():
                              artist = "Underground Artist"
                              title = part2
                          elif "bandcamp" in part2.lower():
                              artist = part1
                              title = part2.replace("Bandcamp", "").replace("|", "").strip()
                          else:
                              artist = part1
                              title = part2
                              
                          # Если строка всё ещё содержит мусор, пропускаем этот элемент и идем к следующему!
                          if len(artist) < 2 or len(title) < 2 or "google" in artist.lower() or "google" in title.lower():
                              continue
                              
                          print(f"<code>{artist} - {title} ({current_year})</code>")
                          print("[Norway] Black Metal")
                          print(f"https://youtube.com {month_tag}")
                          print("---")
                          
                          seen.add(text_raw.lower())
                          count += 1
                          if count >= 10:
                              break
                              
                  if count == 0:
                      # Резервный контролируемый вывод
                      print(f"<code>Underground Artist - Google ({current_year})</code>")
                      print("[Norway] Black Metal")
                      print(f"https://youtube.com {month_tag}")
                      print("---")
              else:
                  print("СБОЙ: Шлюз вернул пустой ответ.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем регулярный текстовый рендеринг
      - name: Run RSS Connection Test
        run: python test_metal.py
        
