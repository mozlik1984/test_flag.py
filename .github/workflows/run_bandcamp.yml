name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py

      # Сборщик сам создаст чистый файл bandcamp.py в корне репозитория!
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > bandcamp.py
          import os
          import json
          from datetime import datetime
          import requests
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          d = chr(46)
          c = chr(58)
          s = chr(47)

          BASE_BC = f"https{c}{s}{s}bandcamp{d}com{s}tag{s}"
          BASE_TG = f"https{c}{s}{s}api{d}telegram{d}org{s}bot"

          BOT_TOKEN = os.getenv("TELEGRAM_TOKEN")
          ADMIN_CHAT_ID = "5002053185"

          BLACK_METAL_TAGS = [
              "black-metal", "atmospheric-black-metal", "depressive-black-metal"
          ]

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          def run_furious_parser():
              now = datetime.now()
              found_releases = []
              seen_identities = set()
              
              status_code = 0
              html_length = 0
              total_links_found = 0
              skipped_by_filters = 0
              sample_titles = []

              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              }

              for tag in BLACK_METAL_TAGS:
                  url = f"{BASE_BC}{tag}"
                  try:
                      res = cloud_requests.get(url, headers=headers, impersonate="chrome110", timeout=20)
                      
                      if status_code == 0:
                          status_code = res.status_code
                          html_length = len(res.text)
                          
                      if res.status_code != 200 or not res.text:
                          continue
                          
                      soup = BeautifulSoup(res.text, "html.parser")
                      links = soup.find_all("a", href=True)
                      
                      for link in links:
                          href = link["href"].lower()
                          text = link.text.strip()
                          
                          if "://bandcamp.com" in href or "/album/" in href:
                              if not text or len(text) {r['artist']} - {r['title']} ({r['year']})</code>
{r['country']} {r['genre']}
https{c}{s}{s}youtube{d}com {month_tag}
---
"""

              telegram_url = f"{BASE_TG}{BOT_TOKEN}{s}sendMessage"
              payload = {
                  "chat_id": ADMIN_CHAT_ID,
                  "text": msg,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }
              requests.post(telegram_url, json=payload)

          if __name__ == "__main__":
              run_furious_parser()
          EOF

      - name: Run Bandcamp Parser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bandcamp.py
        
