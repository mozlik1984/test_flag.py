name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi typing_extensions

      # ШАГ 9.1: Сканируем рабочий HTML на поддомены блэк-метал групп
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from curl_cffi import requests as cloud_requests

          # Наш единственный рабочий адрес, который отдает 111 тысяч символов контента
          URL_DAILY = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 9.1 ---")
          try:
              res = cloud_requests.get(URL_DAILY, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа сервера: {res.status_code}")
              print(f"2. Количество символов в коде: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  # Ищем любые ссылки вида href="https://bandcamp.com"
                  # Исключаем ссылки на саму главную страницу (www.bandcamp, daily.bandcamp, tags.bandcamp)
                  all_domains = re.findall(r'href="https://([^"/]+)\.bandcamp\.com', res.text)
                  
                  # Фильтруем системный мусор
                  band_domains = [d for d in all_domains if d not in ["www", "daily", "api", "f4", "s4", "t4"]]
                  print(f"3. Всего поддоменов групп обнаружено в верстке: {len(band_domains)}")
                  
                  print("\n4. ПЕРВЫЕ 10 ПОДДОМЕНОВ АРТИСТОВ С ЭКРАНА DAILY:")
                  count = 0
                  for bd in set(band_domains):
                      print(f"   -> Найдена страница группы: https://{bd}.bandcamp.com")
                      count += 1
                      if count >= 10:
                          break
                          
                  if count == 0:
                      print("В верстке Daily-страницы ссылки на сторонние поддомены отсутствуют.")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем поиск поддоменов
      - name: Run Subdomain Scanner
        run: python test_metal.py
        
