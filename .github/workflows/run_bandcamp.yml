name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ШАГ 11.7: Исправляем ручку прокси на /raw?url= для получения чистого JSON от Bandcamp
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests

          # ИСПРАВЛЕНО: Используем ручку /raw?url= для получения оригинального контента Bandcamp
          URL_FEED = "https://allorigins.win"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.7 ---")
          try:
              res = requests.get(URL_FEED, headers=HEADERS, timeout=20)
              print(f"1. Код ответа прокси-зеркала: {res.status_code}")
              print(f"2. Количество полученных текстовых символов: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 0:
                  # Экранируем скобки на всякий случай
                  clean_sample = res.text[:350].replace("<", "&lt;").replace(">", "&gt;")
                  print(f"3. Сырой срез текста ответа: {clean_sample}")
              else:
                  print("3. СБОЙ: Прокси прислал пустой ответ.")
                  
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 11.7: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем чтение сырого текста
      - name: Run RSS Connection Test
        run: python test_metal.py
        
