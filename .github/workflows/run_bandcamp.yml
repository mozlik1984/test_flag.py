name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 2: Выводим карту ключей JSON, чтобы найти, где спрятана музыка
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          URL = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 2 ---")
          try:
              res = cloud_requests.get(URL, headers=headers, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, "html.parser")
                  pagedata_tag = soup.find("div", id="pagedata") or soup.find("script", {"id": "pagedata"})
                  
                  if pagedata_tag:
                      raw_blob = pagedata_tag.get("data-blob") or pagedata_tag.text
                      data = json.loads(raw_blob)
                      
                      print("1. Главные ключи в pagedata JSON:")
                      print(list(data.keys()))
                      
                      # Заходим на уровень глубже в самые подозрительные ключи
                      for key in ["hub_data", "tag_data", "items", "tracks"]:
                          if key in data:
                              print(f"\n2. Ключи внутри подблока '{key}':")
                              if isinstance(data[key], dict):
                                  print(list(data[key].keys()))
                                  
                                  # Проверяем наличие вложенных табов (tabs)
                                  if "tabs" in data[key] and isinstance(data[key]["tabs"], dict):
                                      print(f"   -> Найдена секция tabs! Ее подразделы: {list(data[key]['tabs'].keys())}")
                              else:
                                  print(f"   -> Этот блок является списком длиной {len(data[key])} элементов")
                  else:
                      print("СБОЙ: Не удалось найти pagedata")
          except Exception as e:
              print(f"ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем и смотрим структуру на экране Гитхаба
      - name: Run Structure Test
        run: python test_metal.py
        
