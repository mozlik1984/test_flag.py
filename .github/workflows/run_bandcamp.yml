name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      # ШАГ 11.4: Забираем живую музыку через открытое фид-зеркало Bandcamp
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          from datetime import datetime
          from curl_cffi import requests as cloud_requests

          # Вечно открытый JSON-фид зеркала Bandcamp андеграунда
          URL_FEED = "https://allorigins.win"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.4 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              res = cloud_requests.get(URL_FEED, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа зеркала: {res.status_code}")
              
              if res.status_code == 200:
                  raw_contents = res.json().get("contents", "")
                  if raw_contents and "results" in raw_contents or "auto" in raw_contents:
                      data = json.loads(raw_contents)
                      items = data.get("auto", []) or data.get("results", [])
                      print(f"2. УСПЕХ: Найдено сырых релизов в фиде: {len(items)}")
                      
                      print("\n3. СВЕЖИЙ БЛЭК-МЕТАЛ УЛОВ ПО ТВОЕМУ ШАБЛОНУ:\n")
                      count = 0
                      for item in items:
                          name_raw = item.get("name", "")
                          if " - " in name_raw:
                              artist, title = name_raw.split(" - ", 1)
                          else:
                              artist = item.get("artist_name", "Underground Artist")
                              title = name_raw

                          full_desc = f"{artist} {title}".lower()
                          if any(forbidden in full_desc for forbidden in FORBIDDEN_KEYWORDS):
                              continue

                          # Твой идеальный текстовый формат!
                          print(f"<code>{artist.strip()} - {title.strip()} ({current_year})</code>")
                          print("[Norway] Black Metal")
                          print(f"https://youtube.com {month_tag}")
                          print("---")
                          
                          count += 1
                          if count >= 3:
                              break
                      if count == 0:
                          print("Все релизы отсеялись фильтром.")
                  else:
                      print("2. СБОЙ: Зеркало вернуло пустой контент.")
              else:
                  print("2. СБОЙ: Зеркало недоступно.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 11.4: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем финальный тест
      - name: Run RSS Connection Test
        run: python test_metal.py
        
