name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      # ШАГ 11.3: Сканируем чистый текст метал-обзора на музыкальные пары
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import re
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cloud_requests

          # Прямой адрес свежего метал-обзора, который мы выудили из лога
          URL_METAL = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.3 ---")
          try:
              res = cloud_requests.get(URL_METAL, headers=HEADERS, impersonate="chrome110", timeout=20)
              print(f"1. Код ответа сервера при входе в обзор: {res.status_code}")
              print(f"2. Количество символов в коде статьи: {len(res.text)}")
              
              if res.status_code == 200 and len(res.text) > 1000:
                  soup = BeautifulSoup(res.text, "html.parser")
                  
                  # Извлекаем весь чистый текст статьи без HTML тегов
                  plain_text = soup.get_text()
                  
                  # Ищем строки, где текст разделен дефисом (Формат: Исполнитель - Альбом)
                  # Захватываем слова и пробелы разумной длины
                  text_pairs = re.findall(r'([A-Za-z0-9\s\’\‘\“\”]{2,30}\s*–\s*[A-Za-z0-9\s\’\‘\“\”]{2,40})', plain_text) or re.findall(r'([A-Za-z0-9\s]{2,30}\s*-\s*[A-Za-z0-9\s]{2,40})', plain_text)
                  
                  print(f"3. Всего текстовых совпадений обнаружено: {len(text_pairs)}")
                  
                  print("\n4. НАСТОЯЩИЕ МУЗЫКАЛЬНЫЕ СТРОКИ ИЗ ОБЗОРА:")
                  count = 0
                  seen = set()
                  for pair in text_pairs:
                      clean_pair = pair.strip().replace("\n", " ")
                      # Убираем дубликаты и системный навигационный мусор
                      if clean_pair.lower() in seen or "bandcamp" in clean_pair.lower() or len(clean_pair) < 5:
                          continue
                          
                      print(f"   -> Найдено в тексте: {clean_pair}")
                      seen.add(clean_pair.lower())
                      count += 1
                      if count >= 15:
                          break
                          
                  if count == 0:
                      print("В тексте статьи явные музыкальные пары с разделителем не найдены. Выводим кусок начала текста:")
                      print(plain_text[:500])
              else:
                  print("СБОЙ: Не удалось загрузить код обзора.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 11.3: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем текстовый сканер обзора
      - name: Run RSS Connection Test
        run: python test_metal.py
        
