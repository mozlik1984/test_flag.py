name: Run Bandcamp Underground Collector

on:
  workflow_dispatch: # Кнопка ручного запуска
  schedule:
    - cron: '0 12 * * 1' # Запуск каждый понедельник в 12:00 UTC

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Устанавливаем beautifulsoup4 и curl_cffi для обхода Cloudflare
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi requests

      # Запускаем наш чистый питоновский файл
      - name: Run Bandcamp Parser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bandcamp.py
        
