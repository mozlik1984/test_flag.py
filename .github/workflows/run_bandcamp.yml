name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi typing_extensions

      # ШАГ 9.2: Печатаем сырой текст вокруг найденного сборника релизов
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import html
          from curl_cffi import requests as cloud_requests

          URL_DAILY = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 9.2 ---")
          try:
              res = cloud_requests.get(URL_DAILY, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  
                  # Наш главный ориентир, который точно есть на странице
                  marker = "Essential Releases"
                  
                  if marker in html_content:
                      print("1. УСПЕХ: Маркер 'Essential Releases' найден в коде!")
                      idx = html_content.find(marker)
                      
                      # Берем кусок текста после маркера и очищаем от зашифрованных кавычек &quot;
                      raw_chunk = html_content[idx:idx+1200]
                      clean_chunk = html.unescape(raw_chunk)
                      
                      print("\n2. СЫРОЙ ТЕКСТ КАТАЛОГА ДЛЯ ИЗУЧЕНИЯ ФОРМАТА:")
                      print(clean_chunk)
                  else:
                      print("1. СБОЙ: Маркер 'Essential Releases' не найден. Страница обновилась.")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем вывод текстового куска
      - name: Run Text Chunk Scanner
        run: python test_metal.py
        
