name: Run Bandcamp Underground Collector

on:
  workflow_dispatch: # Позволяет запускать кнопкой в любую секунду!
  schedule:
    - cron: '0 12 * * 1' # Сам запускается каждый понедельник в 12:00 по Гринвичу

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Установка библиотек, включая новый бронебойный cloudscraper
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: Run Bandcamp Parser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bandcamp.py
        
