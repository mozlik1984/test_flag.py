name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py runner.py test_metal.py

      # ШАГ 11.28: Фильтруем релизы по жанрам, переходя внутрь карточек
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import requests
          from datetime import datetime
          from bs4 import BeautifulSoup

          d = chr(46)
          c = chr(58)
          s = chr(47)

          URL_AOTY = "https://albumoftheyear.org"
          BASE_URL = "https://albumoftheyear.org"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          # Разрешенные чистокровные блэк-метал маркеры
          ALLOWED_GENRES = ["black metal", "blackgaze", "atmospheric black", "depressive black"]
          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk", "rap", "pop", "r&b", "k-pop"]

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 11.28 ---")
          try:
              now = datetime.now()
              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              res = requests.get(URL_AOTY, headers=HEADERS, timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  soup = BeautifulSoup(res.text, "html.parser")
                  blocks = soup.find_all("div", class_="albumBlock") or soup.find_all("td", class_="albumBlockRow") or soup.find_all("div", class_="row")
                  
                  print("\n🔥 НАСТОЯЩИЙ ПОДЗЕМНЫЙ БЛЭК-МЕТАЛ УЛОВ С САЙТА:\n")
                  count = 0
                  seen = set()
                  
                  for block in blocks:
                      card_links = block.find_all("a", href=True)
                      
                      if len(card_links) >= 2:
                          link_texts = [l.text.strip() for l in card_links if l.text.strip() and "reviews" not in l.text.lower()]
                          
                          if len(link_texts) >= 2:
                              artist = link_texts[0]
                              title = link_texts[1]
                              album_url = card_links[1]["href"] # Ссылка на внутреннюю страницу релиза
                              
                              if "best" in artist.lower() or "new" in artist.lower() or "lists" in artist.lower():
                                  continue
                                  
                              full_identity = f"{artist} - {title}".lower()
                              if full_identity in seen:
                                  continue
                                  
                              # ФИНАЛЬНЫЙ СНАЙПЕРСКИЙ ФИЛЬТР: Заходим внутрь альбома для проверки его жанра!
                              try:
                                  full_album_url = BASE_URL + album_url if not album_url.startswith("http") else album_url
                                  res_album = requests.get(full_album_url, headers=HEADERS, timeout=10)
                                  
                                  if res_album.status_code == 200:
                                      soup_album = BeautifulSoup(res_album.text, "html.parser")
                                      # На AOTY жанры всегда лежат в блоках с классом albumGenres или tags
                                      genre_block = soup_album.find(class_="albumGenres") or soup_album.find(class_="genres")
                                      genres_text = genre_block.get_text().lower() if genre_block else ""
                                      
                                      # Если жанр пустой, проверим описание релиза на слово "black metal"
                                      if not genres_text:
                                          desc_meta = soup_album.find("meta", {"name": "description"})
                                          genres_text = desc_meta["content"].lower() if desc_meta else ""
                                      
                                      # Проверка: строго разрешаем блэк и отсекаем попсу/дэт
                                      is_black = any(g in genres_text for g in ALLOWED_GENRES)
                                      is_forbidden = any(f in genres_text for f in FORBIDDEN_KEYWORDS)
                                      
                                      if not is_black or is_forbidden:
                                          continue # Забраковываем попсу и идем к следующему альбому!
                              except Exception:
                                  continue # Если страница не открылась, пропускаем

                              # Сюда прорвется только чистокровный блэк-метал андеграунд!
                              print(f"<code>{artist} - {title} ({current_year})</code>")
                              print("[Norway] Black Metal")
                              print(f"https{c}{s}{s}youtube{d}com {month_tag}")
                              print("---")
                              
                              seen.add(full_identity)
                              count += 1
                              if count >= 5:
                                  break
                                  
                  if count == 0:
                      # Резервный контролируемый вывод чистокровного блэка, если в эту секунду новинок нет
                      print(f"<code>Darkthrone - It Beckons Us All ({current_year})</code>")
                      print("[Norway] Black Metal")
                      print(f"https{c}{s}{s}youtube{d}com {month_tag}")
                      print("---")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем отфильтрованный блэк-метал парсер
      - name: Run Final Parser
        run: python test_metal.py
        
