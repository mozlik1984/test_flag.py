name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi typing_extensions

      # ШАГ 9.3: Парсим JSON статей, вытаскивая заголовки и ссылки
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > test_metal.py
          import json
          import html
          from curl_cffi import requests as cloud_requests

          URL_DAILY = "https://bandcamp.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          print("--- СТАРТ ДИАГНОСТИКИ ШАГА 9.3 ---")
          try:
              res = cloud_requests.get(URL_DAILY, headers=HEADERS, impersonate="chrome110", timeout=20)
              
              if res.status_code == 200 and len(res.text) > 1000:
                  html_content = res.text
                  marker = 'data-blob="'
                  
                  if marker in html_content:
                      start_idx = html_content.find(marker) + len(marker)
                      end_idx = html_content.find('"', start_idx)
                      
                      raw_blob = html_content[start_idx:end_idx]
                      clean_blob = html.unescape(raw_blob)
                      data = json.loads(clean_blob)
                      
                      # Добираемся до блока со статьями, который мы увидели в логе
                      app_data = data.get("appData", {})
                      editorial = app_data.get("featuredEditorial", {})
                      
                      # Собираем главную статью и вложенные маленькие статьи
                      articles = []
                      if isinstance(editorial, dict):
                          # Проверяем главный баннер
                          big_item = editorial.get("bigItem")
                          if big_item:
                              articles.append(big_item)
                          # Проверяем вложенные маленькие элементы
                          small_items = editorial.get("smallItems", [])
                          articles.extend(small_items)
                          
                      print(f"1. Всего статей обнаружено в блоке: {len(articles)}")
                      
                      print("\n2. НАЗВАНИЯ ОБЗОРОВ И ССЫЛКИ НА BANDCAMP DAILY:")
                      for art in articles:
                          title = art.get("title") or art.get("franchiseName") or "Untitled Article"
                          blurb = art.get("blurb") or ""
                          url = art.get("url") or "No URL"
                          
                          # Выводим информацию о статье на экран
                          print(f"   -> Обзор: {title}")
                          if blurb:
                              print(f"      Описание: {blurb}")
                          print(f"      Ссылка: {url}")
                          print("   ---")
                  else:
                      print("СБОЙ: data-blob не найден.")
              else:
                  print("СБОЙ: Ответ пуст.")
          except Exception as e:
              print(f"КРИТИЧЕСКАЯ ОШИБКА НА ШАГЕ 9.3: {e}")
          print("--- КОНЕЦ ДИАГНОСТИКИ ---")
          EOF

      # Запускаем извлечение названий статей
      - name: Run Article Parser
        run: python test_metal.py
        
