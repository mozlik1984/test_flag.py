name: Run Bandcamp Underground Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  run-bandcamp-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Kill old cache
        run: rm -f bandcamp.py skaner.py inferno.py

      # Сборщик сам создаст чистый файл bandcamp.py в корне репозитория!
      - name: Auto-generate python script
        run: |
          cat << 'EOF' > bandcamp.py
          import os
          import json
          from datetime import datetime
          import requests
          from curl_cffi import requests as cloud_requests

          d = chr(46)
          c = chr(58)
          s = chr(47)

          # ПЕРЕКЛЮЧЕНО НА РАБОЧИЙ ШЛЮЗ ДАННЫХ BANDCAMP
          BASE_API = f"https{c}{s}{s}bandcamp{d}com{s}api{s}hub{s}2{s}dig_deeper"
          BASE_TG = f"https{c}{s}{s}api{d}telegram{d}org{s}bot"

          BOT_TOKEN = os.getenv("TELEGRAM_TOKEN")
          ADMIN_CHAT_ID = "5002053185"

          BLACK_METAL_TAGS = [
              "black-metal", "atmospheric-black-metal", "depressive-black-metal", 
              "raw-black-metal", "symphonic-black-metal", "post-black-metal", 
              "melodic-black-metal", "blackgaze"
          ]

          FORBIDDEN_KEYWORDS = ["thrash", "death", "heavy", "power", "core", "electronic", "punk"]

          def run_furious_parser():
              now = datetime.now()
              found_releases = []
              seen_urls = set()
              
              status_code = 0
              total_search_items = 0
              skipped_by_filters = 0
              sample_titles = []

              month_tag = now.strftime("%b").upper()
              current_year = str(now.year)

              for tag in BLACK_METAL_TAGS:
                  # Легальные параметры POST-запроса для актуального API
                  payload = {
                      "tag": tag,
                      "sort_key": "date",
                      "page": 0
                  }
                  try:
                      res = cloud_requests.post(BASE_API, json=payload, impersonate="chrome110", timeout=15)
                      
                      if status_code == 0:
                          status_code = res.status_code
                          
                      if res.status_code != 200:
                          continue
                          
                      data = res.json()
                      # В этом API альбомы лежат либо в 'items', Bird в 'results'
                      items = data.get("items", []) or data.get("results", [])
                      
                      for item in items:
                          total_search_items += 1
                          album_url = item.get("tralbum_url") or item.get("url")
                          if not album_url or album_url in seen_urls:
                              continue
                              
                          title = item.get("title", "Unknown Album").strip()
                          artist = item.get("artist", "Unknown Artist").strip()
                          
                          tags_list = [t.lower() for t in item.get("tags", [])]
                          full_desc = f"{title} {artist} {' '.join(tags_list)}".lower()
                          
                          if any(forbidden in full_desc for forbidden in FORBIDDEN_KEYWORDS):
                              skipped_by_filters += 1
                              continue

                          if len(sample_titles) < 3:
                              sample_titles.append(f"{artist} - {title}"[:35])

                          location = item.get("artist_location", "").lower() or item.get("location", "").lower()
                          flag = "[Norway]"
                          if "sweden" in location: flag = "[Sweden]"
                          elif "finland" in location: flag = "[Finland]"
                          elif "france" in location: flag = "[France]"
                          elif "germany" in location: flag = "[Germany]"
                          elif "usa" in location or "united states" in location: flag = "[USA]"
                          elif "ukraine" in location: flag = "[Ukraine]"
                          elif "poland" in location: flag = "[Poland]"

                          genre_text = tag.replace("-", " ").title()

                          found_releases.append({
                              "artist": artist,
                              "title": title,
                              "year": current_year,
                              "country": flag,
                              "genre": genre_text
                          })
                          seen_urls.add(album_url)

                  except Exception as e:
                      print(f"Error: {e}")
                      continue

              samples_str = ", ".join([f"'{t}'" for t in sample_titles])
              
              msg = "DIAGNOSTIC LOG HUB API\n\n"
              msg += "METRICS:\n"
              msg += f"Bandcamp status: {status_code}\n"
              msg += f"Total search items: {total_search_items}\n"
              msg += f"Skipped by filters: {skipped_by_filters}\n"
              msg += f"Raw items snippet: [{samples_str}]\n\n"
              
              if not found_releases:
                  msg += "RESULT: No pure black metal releases found in search index."
              else:
                  msg += "NEW RELEASES FROM BANDCAMP:\n\n"
                  for r in found_releases:
                      msg += f"<code>{r['artist']} - {r['title']} ({r['year']})</code>\n"
                      msg += f"{r['country']} {r['genre']}\n"
                      msg += f"https{c}{s}{s}youtube{d}com {month_tag}\n"
                      msg += "---\n"

              telegram_url = f"{BASE_TG}{BOT_TOKEN}{s}sendMessage"
              payload = {
                  "chat_id": ADMIN_CHAT_ID,
                  "text": msg,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }
              requests.post(telegram_url, json=payload)

          if __name__ == "__main__":
              run_furious_parser()
          EOF

      - name: Run Bandcamp Parser
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bandcamp.py
        
